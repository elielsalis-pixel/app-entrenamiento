<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#141414">
<title>Entrenamiento</title>
<link rel="manifest" href="manifest.json">
<script src="biblioteca.js"></script>
<style>
  :root{
    --bg:#f4f3f0; --surface:#ffffff; --surface-2:#eeece7;
    --text:#141414; --text-2:#55544f; --text-muted:#6b6963;
    --border:#dedcd5; --accent:#185fa5; --accent-bg:#e6f1fb;
    --success:#3b6d11; --success-bg:#eaf3de; --on-success:#ffffff;
    --danger:#a32d2d; --danger-bg:#fcebeb;
    --warn:#8a5a00; --warn-bg:#fbf1dc;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141414; --surface:#1e1e1c; --surface-2:#2a2a27;
      --text:#f1efe8; --text-2:#c2c0b7; --text-muted:#9a988f;
      --border:#3a3a37; --accent:#85b7eb; --accent-bg:#0c3a66;
      --success:#97c459; --success-bg:#23400c; --on-success:#10200a;
      --danger:#f09595; --danger-bg:#501313;
      --warn:#f0c46a; --warn-bg:#3d2e0c;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
  button{font-family:inherit;cursor:pointer;color:inherit}
  input,select,textarea{font-family:inherit}
  p{margin:0}
  h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-0.01em}
  h2{font-size:18px;margin:0;font-weight:700}
  .icon{width:20px;height:20px;flex-shrink:0}
  .muted{color:var(--text-muted)}
  .secondary{color:var(--text-2)}
  .label{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);margin:18px 0 8px}
  .pila{display:flex;flex-direction:column;gap:12px}
  .fila2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .btn{min-height:48px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;color:var(--text)}
  .btn:active{transform:scale(0.98)}
  .btn-sm{min-height:40px;font-size:13px;border-radius:10px;padding:0 12px}
  .btn-primary{background:var(--text);color:var(--bg);border:none;font-weight:600;min-height:52px;font-size:16px}
  .btn-ok{background:var(--success);color:var(--on-success);border:none;font-weight:600;min-height:52px;font-size:16px}
  .btn-ghost{background:transparent;border:none;color:var(--text-2);font-size:14px}
  .btn-link{background:transparent;border:none;color:var(--accent);font-size:14px;font-weight:600;min-height:44px}
  .btn-dashed{background:transparent;border:1px dashed var(--border);color:var(--text-2);font-size:14px}
  .btn-danger{background:var(--danger);color:#fff;border:none;font-weight:600}
  .btn-full{width:100%}
  .btn:disabled{opacity:.35}
  .btn-app{min-height:40px;padding:0 10px;gap:6px}
  .acciones-editor{display:flex;gap:6px}
  .acciones-editor .btn{flex:1;min-width:0;padding:0 8px}
  .acciones-editor .btn[aria-label]{flex:0 0 40px;padding:0}
  .iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;padding:0;color:var(--text)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:var(--radius);background:var(--accent-bg);color:var(--accent);font-size:13px;margin-bottom:12px;border:none;width:100%;text-align:left}
  .banner-warn{background:var(--warn-bg);color:var(--warn)}
  .segmentos{display:flex;padding:4px;border-radius:12px;background:var(--surface-2);margin-bottom:12px}
  .segmentos button{flex:1;min-height:40px;border:none;border-radius:9px;background:transparent;font-size:14px;color:var(--text-2)}
  .segmentos button[aria-selected="true"]{background:var(--surface);color:var(--text);font-weight:600}
  .grupo{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden}
  .item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--border);width:100%;background:transparent;border-left:none;border-right:none;border-bottom:none;text-align:left;font-size:15px;color:var(--text);min-height:56px}
  .grupo > .item:first-child, .grupo > div:first-child{border-top:none}
  .item-icono{color:var(--text-2);display:flex}
  .item-texto{flex:1;min-width:0}
  .item-sub{font-size:12px;color:var(--text-2);margin-top:2px}
  .switch{width:50px;height:30px;border-radius:15px;border:none;background:var(--border);position:relative;padding:0;flex-shrink:0}
  .switch::after{content:'';position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:13px;background:#fff;transition:left .15s}

  .semana{display:flex;gap:6px}

  .segbar{display:flex;gap:4px;margin-bottom:4px}
  .seg{flex:1;height:6px;border-radius:3px;background:var(--border);border:none;padding:0}
  .seg.hecho{background:var(--success)}
  .seg.actual{background:var(--accent)}
  .segbar{align-items:center}
  .plan-bloques{display:flex;gap:4px;margin-top:10px}
  .plan-bloque{min-width:60px;border-radius:8px;padding:6px 8px;background:var(--surface-2);display:flex;flex-direction:column;font-size:12px;color:var(--text-2);overflow:hidden}
  .plan-bloque span:first-child{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .plan-bloque.hecho{opacity:.55}
  .plan-bloque.actual{background:var(--accent-bg);color:var(--accent);outline:1px solid var(--accent)}
  .segcirc{display:flex;gap:2px;padding:2px;border:1px solid var(--accent);border-radius:5px}
  .banda-circuito{border:1px solid var(--accent);background:var(--accent-bg);border-radius:14px;padding:10px 12px;margin-bottom:12px}
  .chips-circuito{display:flex;gap:6px;flex-wrap:wrap}

  .sets-head{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
  .sets-head span:nth-child(n+3),.set-row .valor{text-align:center}
  .set-row{min-height:52px;border-radius:12px;background:var(--surface);border:1px solid var(--border);width:100%;font-size:15px;color:var(--text)}
  .set-row .num{font-weight:600;text-align:center;color:var(--text-2)}
  .set-row .ant{font-size:12px;color:var(--text-2)}
  .set-row .valor{font-size:17px}
  .set-row.hecha{background:var(--success-bg);border-color:var(--success-bg)}
  .set-row.hecha .num{color:var(--success)}
  .set-row.hecha .valor{font-weight:600}
  .set-row.borrar{background:var(--danger-bg);border-color:var(--danger)}
  .tipo-chip{font-size:10px;font-weight:700;color:var(--text-2);display:block}
  .check{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;padding:0;color:var(--text-muted)}
  .hecha .check{background:var(--success);border-color:var(--success);color:var(--on-success)}
  .rpe{display:flex;align-items:center;gap:6px;padding:6px 8px 2px 44px;flex-wrap:wrap}
  .rpe button{min-width:36px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:13px}
  .rpe button[aria-pressed="true"]{background:var(--success);border-color:var(--success);color:var(--on-success)}
  .serie-activa{border:2px solid var(--accent);border-radius:14px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
  .stepper{display:flex;flex-direction:column;gap:6px}
  .stepper label{font-size:12px;color:var(--text-2);text-align:center}
  .stepper div{display:flex;align-items:center;gap:6px}
  .stepper button{width:44px;height:48px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:22px;flex-shrink:0}
  .stepper input{width:100%;min-width:0;height:48px;border-radius:12px;border:2px solid var(--accent);background:var(--surface);font-size:22px;font-weight:700;text-align:center;color:var(--text)}
  .campo{display:flex;flex-direction:column;gap:6px}
  .campo label{font-size:12px;color:var(--text-2)}
  .campo input,.campo select{height:48px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:17px;padding:0 12px;color:var(--text);width:100%;min-width:0}
  .opciones{display:flex;gap:8px}
  .opciones button{flex:1;min-width:0;padding:10px 6px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;gap:2px;align-items:center}
  .opciones button b{font-size:14px}
  .opciones button span{font-size:11px;color:var(--text-2);text-align:center}
  .opciones button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-bg);color:var(--accent)}
  .set-input{font-size:15px;padding:10px 6px;text-align:center;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);width:100%;min-height:44px}
  .set-select{font-size:14px;padding:10px 6px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);width:100%;min-height:44px}
  .metricgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;margin:16px 0}
  .metric{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
  .metric p:first-child{font-size:12px;color:var(--text-muted);margin-bottom:2px}
  .metric p:last-child{font-size:19px;font-weight:600}
  .hist-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
  .alt-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px}
  textarea{width:100%;min-height:200px;font-family:ui-monospace,monospace;font-size:12px;padding:10px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text)}
  .codigo{font-family:ui-monospace,monospace;background:var(--surface-2);padding:8px;border-radius:8px;white-space:pre-wrap;word-break:break-word;margin-top:6px}
  #screen{padding:16px;flex:1;padding-bottom:96px}
  body.con-descanso #screen{padding-bottom:170px}
  #restbar{position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;bottom:calc(76px + env(safe-area-inset-bottom));height:64px;border-radius:16px;background:var(--text);color:var(--bg);display:none;align-items:center;gap:8px;padding:0 10px 0 16px;overflow:hidden;z-index:50}
  #restbar .texto{flex:1;min-width:0}
  #restbar .nombre{font-size:11px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #restbar .tiempo{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  #restbar button{height:44px;min-width:50px;border-radius:12px;border:1px solid rgba(128,128,128,.4);background:transparent;color:var(--bg);font-size:14px;font-weight:600}
  #restbar .saltar{background:var(--bg);color:var(--text);border:none;min-width:64px}
  #restbar .progreso{position:absolute;left:0;bottom:0;height:4px;background:var(--success)}
  .cierre{max-height:60vh;overflow:auto;position:fixed;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;bottom:calc(150px + env(safe-area-inset-bottom));background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  #tabbar{display:flex;border-top:1px solid var(--border);background:var(--surface);position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;bottom:0;padding-bottom:env(safe-area-inset-bottom);z-index:40}
  #tabbar button{flex:1;border:none;background:transparent;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-muted);font-size:11px}
  #tabbar button[aria-current="page"]{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div id="app">
  <main id="screen"></main>
  <div id="restbar" role="timer" aria-label="Descanso"></div>
  <nav id="tabbar"></nav>
</div>

<script>
/* ---------- estado y persistencia ---------- */

function loadState(){
  const raw = localStorage.getItem('entrenoState');
  if(raw){
    try{ return JSON.parse(raw); }
    catch(e){ localStorage.setItem('entrenoState_danado_' + Date.now(), raw); }
  }
  return {
    routine: null,          // {days:[{name, exercises:[{nombre,descanso,series,alternativas:[]}]}]}
    history: [],            // sesiones completas
    lastByExercise: {},     // nombre -> {peso,reps}  (fallback general, compatibilidad)
    lastSetsByDayExercise: {}, // "dia::nombre" -> [{peso,reps,tipo}, ...] (serie por serie, por día)
    routineTarde: null,     // {name, exercises:[...]} turno tarde, fuera de la rotación
    historyTarde: [],       // sesiones completas del turno tarde
    prByExercise: {},       // nombre -> mejor volumen (peso*reps) alcanzado
    slot: 0,                // 0..∞, ronda de 5 dias (entrenado o saltado)
    activeSession: null     // sesion en curso
  };
}
let state = loadState();
// claves de funciones que ya no existen (Diagnóstico, plantilla de rutina extra)
['mostrarDiagnostico','mostrarLog','rutinaExtra'].forEach(k=>{ delete state[k]; });
let avisoGuardadoMostrado = false;
function saveState(){
  try{
    localStorage.setItem('entrenoState', JSON.stringify(state));
    if(avisoGuardadoMostrado){ avisoGuardadoMostrado = false; const b=document.getElementById('avisoGuardado'); if(b) b.remove(); }
  } catch(e){
    if(!avisoGuardadoMostrado){
      avisoGuardadoMostrado = true;
      const b = document.createElement('div');
      b.id = 'avisoGuardado';
      b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--danger);color:#fff;padding:10px 16px;font-size:13px;text-align:center';
      b.textContent = 'No se pudo guardar. Descargá una copia de seguridad (Ajustes → Copia de seguridad) y avisá.';
      document.body.appendChild(b);
    }
  }
}

/* ---------- fotos y audios: IndexedDB (sin el límite de ~5MB del almacenamiento común) ---------- */
const media = { images: {}, sounds: [] };   // images: nombreEjercicio -> dataURL ; sounds: [{id,name,data}]
let mediaDB = null;
function abrirMediaDB(){
  return new Promise((res, rej)=>{
    const req = indexedDB.open('entrenoMedia', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('media'); };
    req.onsuccess = ()=>res(req.result);
    req.onerror = ()=>rej(req.error);
  });
}
function mediaTx(op){
  if(!mediaDB) return Promise.resolve();
  return new Promise((res, rej)=>{
    const tx = mediaDB.transaction('media','readwrite');
    op(tx.objectStore('media'));
    tx.oncomplete = ()=>res(); tx.onerror = ()=>rej(tx.error);
  });
}
function mediaPut(key, value){ return mediaTx(st=>st.put(value, key)); }
function mediaDel(key){ return mediaTx(st=>st.delete(key)); }
function mediaClear(){ return mediaTx(st=>st.clear()); }
function mediaLeerTodo(){
  return new Promise((res, rej)=>{
    const out = {};
    const tx = mediaDB.transaction('media','readonly');
    const req = tx.objectStore('media').openCursor();
    req.onsuccess = ()=>{ const c = req.result; if(c){ out[c.key] = c.value; c.continue(); } else res(out); };
    req.onerror = ()=>rej(req.error);
  });
}
function cargarMediaEnMemoria(todo){
  media.images = {}; media.sounds = [];
  Object.keys(todo).forEach(k=>{
    if(k.startsWith('img:')) media.images[k.slice(4)] = todo[k];
    else if(k.startsWith('snd:')) media.sounds.push(todo[k]);
  });
  media.sounds.sort((a,b)=>a.id-b.id);
}
async function iniciarMedia(){
  try{
    mediaDB = await abrirMediaDB();
    // migración única: fotos y audios que estaban dentro del estado pasan a IndexedDB
    let migrado = false;
    if(state.customImages){
      for(const n of Object.keys(state.customImages)) await mediaPut('img:'+n, state.customImages[n]);
      delete state.customImages; migrado = true;
    }
    if(state.customSounds){
      let id = Date.now();
      for(const s of state.customSounds){ const snd = {id: id++, name: s.name, data: s.data}; await mediaPut('snd:'+snd.id, snd); }
      delete state.customSounds; migrado = true;
    }
    if(migrado) saveState();
    cargarMediaEnMemoria(await mediaLeerTodo());
    render();
  } catch(e){ /* sin IndexedDB: la app sigue funcionando sin fotos/audios propios */ }
}
async function guardarImagen(nombre, dataURL){ media.images[nombre] = dataURL; await mediaPut('img:'+nombre, dataURL); }
async function quitarImagen(nombre){ delete media.images[nombre]; await mediaDel('img:'+nombre); }
async function agregarSonido(name, data){ const snd = {id: Date.now(), name, data}; media.sounds.push(snd); await mediaPut('snd:'+snd.id, snd); }
async function quitarSonido(id){ media.sounds = media.sounds.filter(s=>s.id!==id); await mediaDel('snd:'+id); }

// achica la foto antes de guardarla (lado mayor 900px, JPEG) — una foto de celular pasa de varios MB a ~100KB
function comprimirImagen(file){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const max = 900;
      const escala = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*escala); c.height = Math.round(img.height*escala);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('No se pudo leer la imagen')); };
    img.src = url;
  });
}

/* ---------- copia de seguridad ---------- */
function armarCopia(){
  return {
    app: 'entreno', version: 1, fecha: new Date().toISOString(),
    state: JSON.parse(JSON.stringify(state)),
    media: { images: media.images, sounds: media.sounds }
  };
}
function nombreCopia(){ return `entreno-copia-${hoyISO()}.json`; }
function descargarCopia(){
  const blob = new Blob([JSON.stringify(armarCopia())], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombreCopia();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
  state.ultimaCopia = new Date().toISOString(); saveState(); render();
}
function validarCopia(obj){
  return obj && obj.app==='entreno' && obj.state && typeof obj.state==='object' && Array.isArray(obj.state.history);
}
async function restaurarCopia(obj){
  if(!validarCopia(obj)) throw new Error('El archivo no es una copia de esta app.');
  const nuevo = obj.state;
  nuevo.activeSession = nuevo.activeSession || null;
  localStorage.setItem('entrenoState', JSON.stringify(nuevo));
  if(!mediaDB) mediaDB = await abrirMediaDB();
  await mediaClear();
  const imgs = (obj.media && obj.media.images) || {};
  for(const n of Object.keys(imgs)) await mediaPut('img:'+n, imgs[n]);
  for(const s of ((obj.media && obj.media.sounds) || [])) await mediaPut('snd:'+s.id, s);
}

  if(state.migratedSetsBackfill) return;
  state.lastSetsByDayExercise = state.lastSetsByDayExercise || {};
  (state.history||[]).forEach(record=>{

      state.lastSetsByDayExercise[key] = (e.sets||[]).map(s=>({peso:s.peso, reps:s.reps, tipo:s.tipo}));

/* ---------- periodización: PLAN: Hipertrofia 4 | Fuerza 3 | Descarga 1 ---------- */
function parsePlan(texto){
  const bloques = String(texto).split('|').map(p=>p.trim().match(/^(.+?)\s+(\d+)\s*(?:semanas?)?$/i))
    .filter(m=>m && parseInt(m[2], 10) > 0)
    .map(m=>({nombre: m[1].trim(), semanas: parseInt(m[2], 10)}));
  return bloques.length ? bloques : null;
}
function planATexto(plan){ return `PLAN: ${plan.bloques.map(b=>`${b.nombre} ${b.semanas}`).join(' | ')}`; }
function semanasDelPlan(plan){ return plan.bloques.reduce((a,b)=>a + b.semanas, 0); }
// bloque de una semana del plan: {bloque, i, semanaEnBloque}; null si el plan ya terminó
function bloqueDe(semana){
  if(!state.plan) return null;
  let desde = 0;
  for(let i=0; i<state.plan.bloques.length; i++){
    const b = state.plan.bloques[i];
    if(semana <= desde + b.semanas) return {bloque: b, i, semanaEnBloque: semana - desde};
    desde += b.semanas;
  }
  return null;
}
function textoSemanaCorto(){
  const s = semanaActual();
  return state.plan && bloqueDe(s) ? `Semana ${s} de ${semanasDelPlan(state.plan)}` : `Semana ${s}`;
}
function textoBloque(){
  if(!state.plan) return '';
  const actual = bloqueDe(semanaActual());
  return actual ? `${actual.bloque.nombre} (${actual.semanaEnBloque} de ${actual.bloque.semanas})` : 'plan terminado';
}
function textoSemana(){ return [textoSemanaCorto(), textoBloque()].filter(Boolean).join(' · '); }
function textoAviso(a){
  if(a.tipo==='bloque') return `Terminaste el bloque ${a.nombre}: exportá el informe y pedile al Project cómo seguir.`;
  if(a.tipo==='plan') return 'Terminaste el plan: exportá el informe y pedile al Project cómo seguir.';
  return `Completaste la semana ${a.semana}: exportá tu informe para el Project.`;
}
// sin plan, aviso cada 4 semanas; con plan, al terminar cada bloque
function avisoAlTerminarSemana(semana){
  if(!state.plan) return semana % 4 === 0 ? {tipo:'semana', semana} : null;
  const b = bloqueDe(semana);
  if(!b || b.semanaEnBloque < b.bloque.semanas) return null;
  return b.i === state.plan.bloques.length-1 ? {tipo:'plan'} : {tipo:'bloque', nombre: b.bloque.nombre};
}

/* ---------- parser de rutina ---------- */
function todosLosNombresDeEjercicios(){
  const nombres = new Set();
  (state.routine ? state.routine.days : []).forEach(d=>d.exercises.forEach(e=>nombres.add(e.nombre)));
  return [...nombres];
}

function aplicarAjustes(texto){
  const resultado = [];
  const nombresRutina = todosLosNombresDeEjercicios();
  texto.split('\n').forEach(line=>{
    line = line.trim();
    if(!line) return;
    const m = line.match(/^AJUSTE:\s*(.+?)\s*\|\s*peso\s*([\d.,]+)/i);
    if(!m){
      resultado.push({ok:false, texto:`No se pudo leer: "${line}"`});
      return;
    }
    const nombrePedido = m[1].trim();
    const peso = parseFloat(m[2].replace(',','.'));
    const nombreReal = nombresRutina.find(n => n.toLowerCase() === nombrePedido.toLowerCase());
    if(!nombreReal){
      resultado.push({ok:false, texto:`No encontré "${nombrePedido}" en tu rutina actual — revisá el nombre exacto.`});
      return;
    }
    const actual = state.lastByExercise[nombreReal] || {reps: 10};
    registrarCambioPeso(nombreReal, peso, actual.reps, 'Ajuste sugerido (bloque AJUSTE)');
    state.lastByExercise[nombreReal] = {peso, reps: actual.reps};
    // actualizar también las series guardadas por día para este ejercicio (todas las series "Normal")
    state.lastSetsByDayExercise = state.lastSetsByDayExercise || {};
    Object.keys(state.lastSetsByDayExercise).forEach(key=>{
      if(key.endsWith('::'+nombreReal)){
        state.lastSetsByDayExercise[key] = state.lastSetsByDayExercise[key].map(s=>
          s.tipo==='Normal' ? {...s, peso} : s
        );
      }
    });
    resultado.push({ok:true, texto:`✓ ${nombreReal} → ${peso}kg`});
  });
  return resultado;
}

const DEF_MANANA = {descanso:90, series:3, repsMin:8, repsMax:12, calentamiento:0, aproximacion:0};
const DEF_TARDE  = {descanso:60, series:3, repsMin:null, repsMax:null, medida:'reps'};
function lineasDe(text){ return text.split('\n').map(l=>l.trim()).filter(Boolean); }
function parseLineaEjercicio(line, def){
  const parts = line.split('|').map(p=>p.trim());
  if(!parts[0]) return null;
  const e = {nombre: parts[0], ...def, alternativas: []};
  // sin "medida" en el renglón, manda la biblioteca (ej. Plancha se mide en segundos)
  if(!parts.some(p=>/medida\s*[a-z+]+/i.test(p))) ponerMedida(e, medidaPara(buscarEjercicio(e.nombre), def===DEF_TARDE, e.medida));
  parts.slice(1).forEach(p=>{
    let m;
    if((m = p.match(/descanso\s*(\d+)/i))) e.descanso = parseInt(m[1],10);
    if((m = p.match(/series\s*(\d+)/i))) e.series = parseInt(m[1],10);
    if((m = p.match(/calentamiento\s*(\d+)/i))) e.calentamiento = parseInt(m[1],10);
    if((m = p.match(/aproximaci[oó]n\s*(\d+)/i))) e.aproximacion = parseInt(m[1],10);
    if((m = p.match(/reps\s*(\d+)\s*-\s*(\d+)/i))){ e.repsMin = parseInt(m[1],10); e.repsMax = parseInt(m[2],10); }
    if((m = p.match(/medida\s*([a-z+]+)/i)) && MEDIDAS[m[1].toLowerCase()]) e.medida = m[1].toLowerCase();
    if((m = p.match(/alt:\s*(.+)/i))) e.alternativas = m[1].split(',').map(a=>({nombre:a.trim(), detalle:''}));
  });
  if(!parts.some(p=>/reps\s*\d/i.test(p))) sinRepsSiNoCorresponde(e);
  return e;
}
// el rango de reps por defecto no tiene sentido en algo que se mide en segundos o metros
function sinRepsSiNoCorresponde(e){ if(!camposDe(e.medida).includes('reps')){ e.repsMin = null; e.repsMax = null; } }
function ejercicioATexto(e){
  if(e.cardio) return `CARDIO: ${e.nombre}`;
  const partes = [e.nombre];
  if(!e.circuito){   // en un circuito las series y el descanso los define el bloque
    partes.push(`descanso ${e.descanso}`);
    if(e.calentamiento!==undefined) partes.push(`calentamiento ${e.calentamiento||0}`, `aproximacion ${e.aproximacion||0}`);
    partes.push(`series ${e.series}`);
  }
  if(e.medida) partes.push(`medida ${e.medida}`);
  if(e.repsMin) partes.push(`reps ${e.repsMin}-${e.repsMax}`);
  if(e.alternativas && e.alternativas.length) partes.push(`alt: ${e.alternativas.map(a=>a.nombre).join(', ')}`);
  return partes.join(' | ');
}
/* ---------- circuitos: CIRCUITO N vueltas | descanso X ... FIN CIRCUITO ---------- */
// cada vuelta es una serie de cada ejercicio; sin descanso entre ejercicios, descanso al terminar la vuelta
function lineaCircuito(line, ctx){
  if(/^FIN\s+CIRCUITO\b/i.test(line)){ ctx.circ = null; return true; }
  const m = line.match(/^CIRCUITO\b(.*)$/i);
  if(!m) return false;
  const v = m[1].match(/(\d+)\s*vueltas?/i), d = m[1].match(/descanso\s*(\d+)/i);
  ctx.n = (ctx.n || 0) + 1;
  ctx.circ = {id: 'c' + ctx.n, vueltas: v ? parseInt(v[1], 10) : 3, descanso: d ? parseInt(d[1], 10) : 90};
  return true;
}
function meterEnCircuito(e, circ){
  e.circuito = {...circ};
  e.series = circ.vueltas;
  if('calentamiento' in e){ e.calentamiento = 0; e.aproximacion = 0; }
  return e;
}
// grupos consecutivos: un ejercicio suelto o todos los de un mismo circuito
function bloquesDe(lista){
  const out = [];
  lista.forEach((e, i)=>{
    const ult = out[out.length-1];
    if(e.circuito && ult && ult.circuito && ult.circuito.id===e.circuito.id) ult.idx.push(i);
    else out.push({circuito: e.circuito || null, idx: [i]});
  });
  return out;
}
function ejerciciosATexto(lista){
  return bloquesDe(lista).flatMap(b=>{
    const lineas = b.idx.map(i=>ejercicioATexto(lista[i]));
    return b.circuito ? [`CIRCUITO ${b.circuito.vueltas} vueltas | descanso ${b.circuito.descanso}`, ...lineas, 'FIN CIRCUITO'] : lineas;
  });
}
function parseRoutine(text){
  const days = [];
  let current = null, ctx = {};
  let plan = null;
  lineasDe(text).forEach(line=>{
    const planMatch = line.match(/^PLAN\s*:\s*(.+)$/i);
    if(planMatch){ plan = parsePlan(planMatch[1]); return; }
    const dayMatch = line.match(/^DIA\s*\d+\s*:\s*(.+)$/i);
    if(dayMatch){ current = {name: dayMatch[1].trim(), exercises: []}; days.push(current); ctx = {}; return; }
    if(!current || lineaCircuito(line, ctx)) return;
    const e = parseLineaEjercicio(line, DEF_MANANA);
    if(e) current.exercises.push(ctx.circ ? meterEnCircuito(e, ctx.circ) : e);
  });
  return plan ? {days, plan} : {days};
}

const MEDIDAS = {
  'kg+reps': ['peso','reps'],
  'reps':    ['reps'],
  'seg':     ['seg'],
  'kg+seg':  ['peso','seg'],
  'kg+m':    ['peso','m']
};
const CAMPO_INFO = {
  peso: {label:'Kg',   step:2.5, decimal:true},
  reps: {label:'Reps', step:1,   decimal:false},
  seg:  {label:'Seg',  step:5,   decimal:false},
  m:    {label:'Metros', step:5, decimal:false}
};
function camposDe(medida){ return MEDIDAS[medida] || MEDIDAS['kg+reps']; }
function fmtSet(s, medida){
  const partes = camposDe(medida).map(c=>{
    const v = s[c]||0;
    if(c==='peso') return `${v}kg`;
    if(c==='reps') return `${v} reps`;
    if(c==='seg') return `${v} seg`;
    return `${v} m`;
  });
  return partes.join(' x ');
}

function parseTarde(text){
  let name = null;
  const ctx = {};
  const exercises = [];
  lineasDe(text).forEach(line=>{
    const head = line.match(/^TARDE\s*\d*\s*:\s*(.*)$/i);
    if(head){ name = head[1].trim() || 'Turno tarde'; return; }
    if(name===null || lineaCircuito(line, ctx)) return;
    const cm = line.match(/^CARDIO\s*:\s*(.+)$/i);
    if(cm){ exercises.push({nombre: cm[1].split('|')[0].trim(), cardio:true}); return; }
    const e = parseLineaEjercicio(line, DEF_TARDE);
    if(e) exercises.push(ctx.circ ? meterEnCircuito(e, ctx.circ) : e);
  });
  if(name===null || !exercises.length) return null;
  return {name, exercises};
}
function cargarTarde(){
  const txt = document.getElementById('tardePaste').value;
  const parsed = parseTarde(txt);
  if(!parsed){ alert('No se pudo leer. Tiene que empezar con "TARDE: nombre" y tener al menos un ejercicio.'); return; }
  revisarYGuardar({titulo: 'Revisar turno tarde', grupos: [{nombre: parsed.name, ejercicios: parsed.exercises}], tarde: true,
    texto: {id: 'tardePaste', valor: txt}, guardar: ()=>{
      state.routineTarde = parsed;
      editor = null;
      saveState(); render();
    }});
}

function esKgReps(medida){ return camposDe(medida).join('+')==='peso+reps'; }
function fmtCorto(v, medida){
  const x = c=>v[c]||0;
  switch(camposDe(medida).join('+')){
    case 'reps': return `${x('reps')} reps`;
    case 'seg': return `${x('seg')} s`;
    case 'peso+seg': return `${x('peso')} kg · ${x('seg')} s`;
    case 'peso+m': return `${x('peso')} kg · ${x('m')} m`;
    default: return `${x('peso')} × ${x('reps')}`;
  }
}
function nuevaSerie(e, tipo, valores, anterior){
  const s = {tipo, done:false, rpe:null, anterior: anterior || null};
  camposDe(e.medida).forEach(c=>{ s[c] = valores && valores[c]!=null ? valores[c] : 0; });
  if(anterior) s.prev = Object.fromEntries(camposDe(e.medida).map(c=>[c, s[c]]));
  return s;
}
// Precarga cada serie con lo hecho la última vez en ese mismo día (clave) y posición.
// usarGeneral: si no hay dato de ese día, usa el último peso conocido del ejercicio (rutina de la mañana).
function seedSets(e, clave, usarGeneral){
  const repsDef = e.repsMin ? Math.round((e.repsMin+e.repsMax)/2) : 0;
  const guardadas = (state.lastSetsByDayExercise || {})[clave + '::' + e.nombre] || [];
  const porTipo = {Calentamiento:[], 'Aproximación':[], Normal:[]};
  guardadas.forEach(s=>{ (porTipo[s.tipo] || porTipo.Normal).push(s); });
  const general = !guardadas.length && usarGeneral ? state.lastByExercise[e.nombre] : null;
  const base = porTipo.Normal[0] || (general ? {peso: general.peso, reps: general.reps} : {peso:0, reps: repsDef});
  const armar = (tipo, n, pct)=>Array.from({length:n}, (_,i)=>{
    const arr = porTipo[tipo];
    if(arr.length) return nuevaSerie(e, tipo, arr[Math.min(i, arr.length-1)], i < arr.length ? fmtCorto(arr[i], e.medida) : null); // las extra copian la última conocida
    const v = {...base, reps: guardadas.length ? repsDef : base.reps};
    if(v.peso && pct!==1) v.peso = Math.round(v.peso*pct);
    return nuevaSerie(e, tipo, v);
  });
  const sets = [
    ...armar('Calentamiento', e.calentamiento||0, 0.5),
    ...armar('Aproximación', e.aproximacion||0, 0.75),
    ...armar('Normal', e.series===undefined ? 3 : e.series, 1)
  ];
  if(!sets.length) sets.push(nuevaSerie(e, 'Normal', base));
  // progresión sugerida: si la vez pasada llegaste al tope de reps en todas, precarga el peso siguiente
  if(e.repsMax && esKgReps(e.medida) && porTipo.Normal.length && porTipo.Normal.every(s=>(s.reps||0) >= e.repsMax)){
    const paso = pasoDe(e.nombre);
    sets.filter(s=>s.tipo==='Normal').forEach(s=>{ s.peso = Math.round((s.peso + paso)*100)/100; s.sugerido = paso; });
  }
  return sets;
}
function exDone(ej){ return ej.cardio ? !!ej.cardioHecho : ej.sets.every(s=>s.done); }
function debeSubirPeso(ej){
  const normales = ej.sets.filter(s=>s.tipo==='Normal');
  if(!normales.length || !normales.every(s=>s.done)) return false;
  const max = ej.repsMax || 12;
  return normales.every(s=>s.reps >= max);
}







/* ---------- discos, 1RM y notas ---------- */
const DISCOS_DISPONIBLES = [25,20,15,10,5,2.5,1.25];
function calcularDiscos(pesoTotal, pesoBarra){
  pesoBarra = pesoBarra || 20;
  let porLado = (pesoTotal - pesoBarra) / 2;
  if(porLado <= 0) return { discos: [], sobra: 0, imposible: pesoTotal < pesoBarra };
  const usados = [];
  DISCOS_DISPONIBLES.forEach(d=>{
    while(porLado >= d - 0.001){ usados.push(d); porLado -= d; }
  });
  return { discos: usados, sobra: Math.round(porLado*100)/100, imposible: false };
}
function estimar1RM(peso, reps){
  if(!peso || !reps) return 0;
  return Math.round(peso * (1 + reps/30));
}
function mejorSetActual(ej){
  let mejor = null;
  ej.sets.filter(s=>s.tipo==='Normal' && s.done && s.peso>0).forEach(s=>{
    const e1rm = estimar1RM(s.peso, s.reps);
    if(!mejor || e1rm > mejor.e1rm) mejor = {peso:s.peso, reps:s.reps, e1rm};
  });
  return mejor;
}

function beep(){
  if(state.sonidoPreferido==='custom' && media.sounds.length){

    new Audio(elegido.data).play().catch(beepGenerado); // si tu audio no se puede reproducir, suena el beep
    return;
  }

function beepGenerado(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0,0.15,0.3].forEach((t,i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = i<2 ? 880 : 1320;
      gain.gain.setValueAtTime(0.15, ctx.currentTime + t);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.12);
      osc.start(ctx.currentTime + t);
      osc.stop(ctx.currentTime + t + 0.13);
    });
  } catch(e){
    console.warn('Sin audio disponible; queda el aviso en pantalla.', e);
  }
}

/* ---------- finalizar sesión ---------- */
function contarSeries(ses){
  let pendientes = 0, hechas = 0;
  ses.exercises.forEach(e=>{
    if(e.cardio){ e.cardioHecho ? hechas++ : pendientes++; }
    else e.sets.forEach(s=>{ s.done ? hechas++ : pendientes++; });
  });
  return {pendientes, hechas};
}
function pedirFinalizar(){
  const {pendientes, hechas} = contarSeries(state.activeSession);
  if(!hechas){
    if(confirm('No marcaste ninguna serie. ¿Cerrar la sesión sin guardar nada?')){
      detenerTimer(); state.activeSession = null; setSessionView('activa'); saveState(); setTab('inicio');
    }
    return;
  }
  if(pendientes && !confirm(`Te quedan ${pendientes} serie${pendientes>1?'s':''} sin marcar: no se van a guardar. ¿Finalizar igual?`)) return;
  finalizarSesion();
}
// historial viejo: las series tienen done:true/false; solo cuentan las hechas
function setsHechos(e){ return (e.sets||[]).filter(s=>s.done!==false); }
function volumenDe(h){ return h.exercises.reduce((a,e)=>a+setsHechos(e).reduce((b,s)=>b+(s.peso||0)*(s.reps||0),0),0); }


function serieLimpia(s, medida){
  const out = {tipo: s.tipo, rpe: s.rpe, done: true};
  camposDe(medida).forEach(c=>{ out[c] = s[c]||0; });
  return out;
}
function finalizarSesion(){
  cerrarCierre();
  detenerTimer();
  const ses = state.activeSession;
  const tarde = ses.turno==='tarde';
  const clave = tarde ? TARDE_KEY : ses.dayName;
  const duracionSeg = Math.round((Date.now()-ses.inicio)/1000);
  state.lastSetsByDayExercise = state.lastSetsByDayExercise || {};
  let volumenTotal = 0, prCount = 0;
  const exercises = [];
  ses.exercises.forEach(e=>{
    if(e.cardio){
      if(e.cardioHecho) exercises.push({nombre:e.nombre, cardio:true, cardioData:{...e.cardioData}});
      return;
    }
    if(e.prLogrado) prCount++;
    const hechas = e.sets.filter(s=>s.done).map(s=>serieLimpia(s, e.medida));
    if(!hechas.length) return; // no hecho: no se registra ni cambia lo guardado para la próxima
    if(esKgReps(e.medida)) hechas.forEach(s=>{ volumenTotal += s.peso*s.reps; });
    state.lastSetsByDayExercise[clave + '::' + e.nombre] = hechas.map(({rpe, done, ...v})=>v);
    if(!tarde && esKgReps(e.medida)){
      const normales = hechas.filter(s=>s.tipo==='Normal' && s.peso>0);
      const ref = normales.length ? normales[normales.length-1] : hechas[hechas.length-1];
      registrarCambioPeso(e.nombre, ref.peso, ref.reps, `Fin de sesión (${ses.dayName})`);
      state.lastByExercise[e.nombre] = {peso: ref.peso, reps: ref.reps};
    }
    // la mañana guarda la medida solo si no es kg+reps (lo implícito)
    const registro = {nombre:e.nombre, sets:hechas};
    if(tarde || e.medida) registro.medida = e.medida;
    if(e.circuito) registro.circuito = e.circuito.vueltas;
    exercises.push(registro);
  });

  const record = {fecha: new Date().toISOString(), exercises, duracionSeg, volumenTotal, prCount, comparacion: null};
  const enBloque = bloqueDe(semanaActual());
  if(enBloque) record.bloque = enBloque.bloque.nombre;
  if(tarde){
    record.turno = 'tarde';
    record.dayName = 'Turno tarde: ' + ses.rutinaNombre;
    state.historyTarde = state.historyTarde || [];
    state.historyTarde.push(record);
  } else {
    record.dayName = ses.dayName;
    const prevSame = [...state.history].reverse().find(h=>h.dayName===ses.dayName);
    const prevVol = prevSame ? volumenDe(prevSame) : 0;
    if(prevVol) record.comparacion = Math.round(((volumenTotal-prevVol)/prevVol)*100);
    state.history.push(record);
    avanzarSlot();
  }
  state.lastResumen = record;
  state.activeSession = null;
  setSessionView('resumen');
  saveState();
  render();
}

function avanzarSlot(){
  const semana = semanaActual();
  state.slot++;
  state.aviso = null;
  if(state.slot % diasPorSemana() !== 0) return;
  state.semana = semana + 1;
  state.aviso = avisoAlTerminarSemana(semana);
}

function renderChartEjercicio(nombre){
  const puntos = [];
  state.history.forEach(h=>{
    const ex = h.exercises.find(e=>e.nombre===nombre);
    if(!ex) return;
    let mejor1rm = 0, mejorPeso = 0;
    setsHechos(ex).filter(s=>s.tipo==='Normal').forEach(s=>{
      const e1rm = estimar1RM(s.peso, s.reps);
      if(e1rm > mejor1rm){ mejor1rm = e1rm; mejorPeso = s.peso; }
    });
    if(mejor1rm>0) puntos.push({fecha: new Date(h.fecha), peso: mejorPeso, e1rm: mejor1rm});
  });
  if(puntos.length < 2){
    return el(`<p class="muted" style="font-size:12px">Necesitás al menos 2 sesiones de este ejercicio para ver el gráfico.</p>`);
  }
  const w = 320, h = 140, pad = 24;
  const maxV = Math.max(...puntos.map(p=>p.e1rm)) * 1.1;
  const minV = Math.min(...puntos.map(p=>p.e1rm)) * 0.9;
  const xStep = (w - pad*2) / (puntos.length - 1);
  const yFor = v => h - pad - ((v - minV) / (maxV - minV || 1)) * (h - pad*2);
  const coords = puntos.map((p,i)=>`${pad + i*xStep},${yFor(p.e1rm)}`);
  const path = 'M ' + coords.join(' L ');
  const dots = puntos.map((p,i)=>`<circle cx="${pad + i*xStep}" cy="${yFor(p.e1rm)}" r="3" fill="var(--accent)"></circle>`).join('');
  const first = puntos[0], last = puntos[puntos.length-1];
  const svg = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${dots}
  </svg>`;
  const wrap = el(`<div class="card"></div>`);
  wrap.innerHTML = svg;
  wrap.appendChild(el(`<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-top:4px">
    <span>${first.fecha.toLocaleDateString('es-AR',{day:'2-digit',month:'short'})}: ${first.e1rm}kg 1RM</span>
    <span>${last.fecha.toLocaleDateString('es-AR',{day:'2-digit',month:'short'})}: ${last.e1rm}kg 1RM</span>
  </div>`));
  return wrap;
}

/* ---------- informe: análisis para el Project ---------- */
function esEfectiva(s){ return ['Normal','Fallo'].includes(s.tipo || 'Normal'); }
function fechaCorta(f){ const d = new Date(f); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`; }
// directas: el músculo es principal en el ejercicio; indirectas: trabaja como secundario
function informeSeriesPorMusculo(sesiones){
  const semanas = new Map();
  const sinDatos = new Set();
  sesiones.forEach(h=>{
    const k = inicioSemana(h.fecha).getTime();
    if(!semanas.has(k)) semanas.set(k, {directas:{}, indirectas:{}});
    const sem = semanas.get(k);
    h.exercises.forEach(e=>{
      const n = e.cardio ? 0 : setsHechos(e).filter(esEfectiva).length;
      if(!n) return;
      const x = buscarEjercicio(e.nombre);
      if(!x){ sinDatos.add(e.nombre); return; }
      x.principal.forEach(m=>{ sem.directas[m] = (sem.directas[m]||0) + n; });
      x.secundarios.forEach(m=>{ sem.indirectas[m] = (sem.indirectas[m]||0) + n; });
    });
  });
  if(!semanas.size) return '';
  let out = `\n\n=== SERIES EFECTIVAS POR MÚSCULO Y SEMANA ===\n`;
  out += `Cuenta series normales y al fallo (sin calentamiento ni aproximación), mañana y tarde. Directas: el músculo es el principal del ejercicio. Indirectas: trabaja como secundario.\n`;
  [...semanas.keys()].sort((a,b)=>a-b).forEach(k=>{
    const {directas, indirectas} = semanas.get(k);
    out += `\nSemana del ${fechaCorta(k)}\n`;
    MUSCULOS.filter(m=>directas[m] || indirectas[m]).forEach(m=>{
      const partes = [];
      if(directas[m]) partes.push(`${directas[m]} directas`);
      if(indirectas[m]) partes.push(`${indirectas[m]} indirectas`);
      out += `  ${m}: ${partes.join(' + ')}\n`;
    });
  });
  if(sinDatos.size) out += `\nSin datos de músculo (no están en la biblioteca): ${[...sinDatos].join(', ')}\n`;
  return out;
}
// mejor marca de una sesión según cómo se mide; en los asistidos, menos peso es mejor
function marcaDeSesion(e){
  const sets = setsHechos(e).filter(esEfectiva);
  if(!sets.length) return null;
  const campos = camposDe(e.medida);
  if(/asistid/.test(normalizarNombre(e.nombre))) return {v: Math.min(...sets.map(s=>s.peso||0)), unidad: 'kg de asistencia (menos es mejor)', menosEsMejor: true};
  const conPeso = sets.some(s=>s.peso > 0);
  if(campos.join('+')==='peso+reps' && !conPeso) return {v: Math.max(...sets.map(s=>s.reps||0)), unidad: 'reps'};
  if(campos.join('+')==='peso+reps') return {v: Math.max(...sets.map(s=>estimar1RM(s.peso||0, s.reps||0))), unidad: 'kg 1RM estimado'};
  const campo = campos.includes('peso') ? 'peso' : campos[0];
  return {v: Math.max(...sets.map(s=>s[campo]||0)), unidad: {peso:'kg', reps:'reps', seg:'seg'}[campo]};
}
function marcasDe(nombre){
  return [...(state.history||[]), ...(state.historyTarde||[])]
    .sort((a,b)=>new Date(a.fecha)-new Date(b.fecha))
    .map(h=>{ const e = h.exercises.find(x=>x.nombre===nombre && !x.cardio); const m = e && marcaDeSesion(e); return m && {...m, fecha: h.fecha}; })
    .filter(Boolean);
}
const SESIONES_ESTANCADO = 3;
function informeProgreso(usados, desde){
  const lineas = [];
  [...usados].forEach(nombre=>{
    const todas = marcasDe(nombre);
    const periodo = todas.filter(m=>new Date(m.fecha).getTime() >= (desde||0));
    if(!periodo.length) return;
    const mejor = (a,b)=>todas[0].menosEsMejor ? a < b : a > b;
    const ini = periodo[0], fin = periodo[periodo.length-1];
    let linea = `${nombre}: ${ini.v} → ${fin.v} ${fin.unidad} · ${periodo.length} ${periodo.length===1 ? 'sesión' : 'sesiones'}`;
    if(ini.v && fin.v!==ini.v) linea += ` (${fin.v > ini.v ? '+' : ''}${Math.round((fin.v-ini.v)/ini.v*100)}%)`;
    if(todas.length > SESIONES_ESTANCADO){
      const previas = todas.slice(0, -SESIONES_ESTANCADO).map(m=>m.v);
      const record = previas.reduce((a,b)=>mejor(b,a) ? b : a);
      if(!todas.slice(-SESIONES_ESTANCADO).some(m=>mejor(m.v, record))) linea += ` · ESTANCADO: ${SESIONES_ESTANCADO} sesiones sin superar ${record}`;
    }
    lineas.push(linea);
  });
  if(!lineas.length) return '';
  return `\n\n=== PROGRESO POR EJERCICIO (primera → última sesión del período) ===\n${lineas.join('\n')}\n`;
}
function informeRutinaActual(){
  if(!state.routine) return '';
  let out = `\n\n=== RUTINA ACTUAL (mismo formato para cargarla) ===\n`;
  if(state.plan) out += `${planATexto(state.plan)}\n`;
  state.routine.days.forEach((d,i)=>{ out += diaToText(d, i); });
  if(state.routineTarde) out += `\n${tardeToText(state.routineTarde)}`;
  return out;
}
function informeBiblioteca(){
  const noHay = BIBLIOTECA.filter(x=>!disponible(x)).map(x=>x.nombre);
  const propios = (state.bibliotecaPropia||[]).map(x=>`${x.nombre} (${PATRONES[x.patron]} · ${x.principal.join(', ')} · ${x.equipo} · carga lumbar ${x.lumbar} · se mide en ${x.medida})`);
  const enRutina = [...(state.routine ? state.routine.days.flatMap(d=>d.exercises) : []), ...(state.routineTarde ? state.routineTarde.exercises : [])];
  const fuera = [...new Set(enRutina.filter(e=>!e.cardio && !buscarEjercicio(e.nombre)).map(e=>e.nombre))];
  if(!noHay.length && !propios.length && !fuera.length) return '';
  let out = `\n\n=== BIBLIOTECA Y GIMNASIO ===\n`;
  if(noHay.length) out += `No hay en mi gimnasio: ${noHay.join(', ')}\n`;
  if(propios.length) out += `Ejercicios propios:\n${propios.map(p=>`  ${p}`).join('\n')}\n`;
  if(fuera.length) out += `En la rutina pero fuera de la biblioteca: ${fuera.join(', ')}\n`;
  return out;
}

function valoresSerie(s, medida){ const c = camposDe(medida); return ['peso','reps','seg','m'].map(k=>c.includes(k) ? s[k] : ''); }
function generarCSV(desde){
  const rows = [['Fecha','Dia','Ejercicio','Serie','Medida','Kg','Reps','Seg','Metros','Tipo','RPE']];
  enPeriodo(state.history, desde).forEach(h=>{
    const fecha = new Date(h.fecha).toLocaleDateString('es-AR');
    h.exercises.forEach(e=>{
      setsHechos(e).forEach((s,i)=>{
        rows.push([fecha, h.dayName, e.nombre, i+1, e.medida || 'kg+reps', ...valoresSerie(s, e.medida), s.tipo, s.rpe||'']);
      });
    });
  });
  let csv = aCSV(rows);

  const tarde = enPeriodo(state.historyTarde, desde);
  if(tarde.length){
    const rowsT = [['Fecha','Turno tarde','Ejercicio','Serie','Medida','Kg','Reps','Seg','Metros','RPE','Cardio (detalle)']];
    tarde.forEach(h=>{
      const fecha = new Date(h.fecha).toLocaleDateString('es-AR');
      const nombreR = h.dayName.replace('Turno tarde: ','');
      h.exercises.forEach(e=>{
        if(e.cardio){ rowsT.push([fecha, nombreR, e.nombre, '', 'cardio', '', '', '', '', '', fmtCardio(e.cardioData)]); return; }
        e.sets.forEach((s,i)=>rowsT.push([fecha, nombreR, e.nombre, i+1, e.medida, ...valoresSerie(s, e.medida), s.rpe||'', '']));
      });
    });
    csv += '\n\n' + aCSV(rowsT);
  }

  const extra = enPeriodo(state.actividadesExtra, desde);
  if(extra.length){
    const rows2 = [['Fecha','Tipo','Detalle1','Detalle2','Detalle3','Nota']];
    extra.forEach(a=>{
      const fecha = new Date(a.fecha).toLocaleDateString('es-AR');
      if(a.tipo==='cardio') rows2.push([fecha, 'Cardio', '', '', fmtCardio(cardioDe(a)), '']);
      else rows2.push([fecha, (SUELTOS[a.tipo]||SUELTOS.agarre).etiqueta, a.ejercicio, a.series.map(s=>`${s.valor}${s.unidad}`).join(' / '), '', a.nota||'']);
    });
    csv += '\n\n' + aCSV(rows2);
  }

  return csv;
}

function detalleEjercicio(e){
  if(e.cardio) return 'cardio';
  const partes = e.circuito ? [] : [`${(e.calentamiento||0)+(e.aproximacion||0)+(e.series||0)} series`];
  if(e.repsMin) partes.push(`${e.repsMin}-${e.repsMax} reps`);
  // la medida se aclara solo si no es la obvia (kg+reps, o reps cuando ya hay rango)
  if(e.medida && e.medida!=='kg+reps' && !(e.medida==='reps' && e.repsMin)) partes.push(e.medida);
  if(!e.circuito) partes.push(`desc ${fmtDescanso(e.descanso)}`);
  return partes.join(' · ') || 'en circuito';
}

function botonRestaurar(){
  const box = document.createElement('div');
  const btn = el(`<button class="btn btn-full">${icon('upload')} Restaurar</button>`);
  const input = el(`<input type="file" accept="application/json,.json" style="display:none">`);
  btn.onclick = ()=> input.click();
  input.onchange = (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      let obj;
      try{ obj = JSON.parse(reader.result); } catch(err){ alert('El archivo no se puede leer.'); return; }
      if(!validarCopia(obj)){ alert('El archivo no es una copia de esta app.'); return; }
      const f = new Date(obj.fecha).toLocaleDateString('es-AR');
      if(!confirm(`¿Restaurar la copia del ${f}? Reemplaza todo lo que hay ahora en la app (${obj.state.history.length} sesiones en la copia).`)) return;
      try{ await restaurarCopia(obj); location.reload(); }
      catch(err){ alert('No se pudo restaurar: ' + err.message); }
    };
    reader.readAsText(file);
  };
  box.appendChild(btn); box.appendChild(input);
  return box;
}

const TIPOS = ['Normal','Calentamiento','Aproximación','Fallo'];
function columnasSeries(ej){ return `30px 76px ${camposDe(ej.medida).map(()=>'minmax(0,1fr)').join(' ')} 48px`; }
function serieActivaIdx(ej){
  if(ej.activa!=null && ej.sets[ej.activa]) return ej.activa;
  return ej.sets.findIndex(s=>!s.done);
}
function marcarHecha(ej, si){
  const s = ej.sets[si];
  const vueltaAntes = ej.circuito ? vueltaDe(miembrosCircuito(ej)) : null;
  s.done = true; s.deleteMode = false;
  registrarSetDone(ej, s);
  ej.activa = null;
  if(ej.circuito){ avanzarCircuito(ej, vueltaAntes); return; }
  iniciarTimer(ej);
  saveState(); render();
  if(exDone(ej)) mostrarCierreEjercicio(ej);
}
function miembrosCircuito(ej){ return state.activeSession.exercises.filter(e=>e.circuito && e.circuito.id===ej.circuito.id); }
function hechasDe(e){ return e.sets.filter(s=>s.done).length; }
// vuelta en curso (0 = primera): la menor cantidad de series hechas entre los que faltan; null si terminó
function vueltaDe(miembros){
  const pendientes = miembros.filter(e=>!exDone(e));
  return pendientes.length ? Math.min(...pendientes.map(hechasDe)) : null;
}
// sin descanso entre ejercicios: pasa al siguiente de la vuelta; al cerrar la vuelta, descanso y vuelve al primero
function avanzarCircuito(ej, vueltaAntes){
  const ses = state.activeSession;
  const miembros = miembrosCircuito(ej);
  const vuelta = vueltaDe(miembros);
  if(vuelta===null){ saveState(); render(); mostrarCierre(miembros); return; }
  const idx = ses.exercises.indexOf(ej);
  const enEstaVuelta = miembros.filter(e=>!exDone(e) && hechasDe(e)===vuelta);
  const sig = vuelta > vueltaAntes ? enEstaVuelta[0] : (enEstaVuelta.find(e=>ses.exercises.indexOf(e) > idx) || enEstaVuelta[0]);
  ses.focusIdx = ses.exercises.indexOf(sig);
  if(vuelta > vueltaAntes) iniciarTimer({nombre: sig.nombre, descanso: ej.circuito.descanso});
  saveState(); render();
}
function bandaCircuito(ej){
  const miembros = miembrosCircuito(ej);

  const total = Math.max(...miembros.map(e=>e.sets.length));
  const banda = el(`<div class="banda-circuito"><p style="font-size:13px;margin-bottom:8px"><b>Circuito</b> · ${vuelta===null ? 'completo' : `Vuelta ${vuelta+1} de ${total}`} · descanso ${fmtDescanso(ej.circuito.descanso)} al terminar cada vuelta</p><div class="chips-circuito"></div></div>`);
  miembros.forEach(m=>{
    const listo = exDone(m) || (vuelta!==null && hechasDe(m) > vuelta);
    const b = el(`<button class="chip-circuito ${m===ej ? 'actual' : ''} ${listo ? 'hecho' : ''}">${listo ? icon('check') : ''}${esc(m.nombre)}</button>`);
    b.onclick = ()=>{ state.activeSession.focusIdx = state.activeSession.exercises.indexOf(m); saveState(); render(); };
    banda.lastChild.appendChild(b);

  return banda;
}

let holdTimeout = null;
let holdDisparado = false;
function mantenerPresionado(nodo, accion){
  const empezar = ()=>{ holdDisparado = false; holdTimeout = setTimeout(()=>{ holdDisparado = true; accion(); setTimeout(()=>{ holdDisparado = false; }, 400); }, 550); };
  const cancelar = ()=>clearTimeout(holdTimeout);
  nodo.onmousedown = empezar; nodo.onmouseup = cancelar; nodo.onmouseleave = cancelar;
  nodo.ontouchstart = empezar; nodo.ontouchend = cancelar; nodo.ontouchmove = cancelar;
}
function stepperCell(ej, s, campo){
  const info = CAMPO_INFO[campo];
  if(s[campo]===undefined) s[campo] = 0;
  const rango = campo==='reps' && ej.repsMin ? ` (${ej.repsMin}–${ej.repsMax})` : '';
  const box = el(`<div class="stepper"><label>${info.label}${rango}</label><div></div></div>`);
  const fila = box.lastChild;
  const menos = el(`<button aria-label="Restar ${info.label}">−</button>`);
  const input = el(`<input type="text" inputmode="${info.decimal?'decimal':'numeric'}" aria-label="${info.label}" value="${esc(s[campo])}">`);
  const mas = el(`<button aria-label="Sumar ${info.label}">+</button>`);
  input.onfocus = ()=>input.select();
  input.oninput = ()=>{ s[campo] = info.decimal ? (parseFloat(input.value.replace(',','.'))||0) : (parseInt(input.value,10)||0); saveState(); };
  menos.onclick = ()=>{ s[campo] = Math.max(0, (s[campo]||0) - info.step); input.value = s[campo]; saveState(); };
  mas.onclick = ()=>{ s[campo] = (s[campo]||0) + info.step; input.value = s[campo]; saveState(); };
  fila.appendChild(menos); fila.appendChild(input); fila.appendChild(mas);
  return box;
}

/* ---------- descanso: uno solo a la vez, visible en toda la app ---------- */
let restInterval = null;
let notifTimeoutId = null;
function detenerTimer(){ clearInterval(restInterval); clearTimeout(notifTimeoutId); }
function iniciarTimer(ej){
  state.activeSession.descanso = {nombre: ej.nombre, total: ej.descanso, finEn: Date.now() + ej.descanso*1000};
  programarDescanso();
}
function programarDescanso(){
  detenerTimer();
  const d = state.activeSession && state.activeSession.descanso;
  if(d){
    restInterval = setInterval(tickTimer, 1000);
    notifTimeoutId = setTimeout(()=>notificar('Descanso terminado', `Volvé a ${d.nombre}`), Math.max(0, d.finEn - Date.now()));
  }
  saveState();
  tickTimer();
}
function restanteDescanso(){
  const d = state.activeSession && state.activeSession.descanso;
  return d ? Math.max(0, Math.ceil((d.finEn - Date.now())/1000)) : 0;
}
function tickTimer(){
  const d = state.activeSession && state.activeSession.descanso;
  if(d && Date.now() >= d.finEn){
    detenerTimer();
    state.activeSession.descanso = null;
    saveState();
    beep();
    mostrarMotivacion(frase(FRASES_TIMER));
  }
  pintarDescanso();
}
function ajustarDescanso(seg){
  const d = state.activeSession.descanso;
  d.finEn = Math.max(Date.now(), d.finEn + seg*1000);
  d.total = Math.max(d.total, restanteDescanso());
  programarDescanso();
}
function saltarDescanso(){ detenerTimer(); state.activeSession.descanso = null; saveState(); pintarDescanso(); }
function pintarDescanso(){
  const bar = document.getElementById('restbar');
  const d = state.activeSession && state.activeSession.descanso;
  document.body.classList.toggle('con-descanso', !!d);
  if(!d){ bar.style.display = 'none'; return; }
  if(!bar.dataset.armado){

/* ---------- biblioteca de ejercicios ---------- */
// mismo criterio que herramientas/biblioteca/generar.py: minúsculas, sin acentos ni signos
function normalizarNombre(s){
  return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
const BIB_POR_ALIAS = new Map();
BIBLIOTECA.forEach(x=>x.alias.forEach(a=>BIB_POR_ALIAS.set(a, x)));
const ORDEN_LUMBAR = {baja:0, media:1, alta:2};
const MUSCULOS = ['Pecho','Dorsales','Espalda media','Hombros','Trapecios','Bíceps','Tríceps','Antebrazos','Cuádriceps','Isquiotibiales','Glúteos','Aductores','Abductores','Gemelos','Abdominales','Zona lumbar'];
const EQUIPOS = ['Barra','Mancuernas','Polea','Máquina','Smith','Peso corporal','Kettlebell','Barra Z','Banda','Balón medicinal','Otro'];

function bibliotecaCompleta(){ return [...BIBLIOTECA, ...(state.bibliotecaPropia||[])]; }
function buscarEjercicio(nombre){
  const k = normalizarNombre(nombre);
  return BIB_POR_ALIAS.get(k) || (state.bibliotecaPropia||[]).find(x=>normalizarNombre(x.nombre)===k) || null;
}
// medida que corresponde según la biblioteca; en la mañana kg+reps es lo implícito y no se guarda
function medidaPara(x, tarde, actual){
  if(!x || x.medida==='cardio') return actual;
  return x.medida==='kg+reps' && !tarde ? undefined : x.medida;
}
function ponerMedida(e, medida){ if(medida===undefined) delete e.medida; else e.medida = medida; }
function disponible(x){ return !(state.noDisponibles||[]).includes(x.id); }
function imagenDe(nombre){
  const x = buscarEjercicio(nombre);
  return media.images[nombre] || (x && (x.ilustracion || x.fotos[0])) || null;
}
// Reemplazos: mismo patrón de movimiento, disponibles en tu gimnasio y fuera del día.
// Ordena por músculo en común y castiga los que cargan más la zona lumbar que el original.
function sugerenciasReemplazo(nombre, excluir){
  const base = buscarEjercicio(nombre);
  if(!base) return [];
  const fuera = new Set((excluir||[]).map(normalizarNombre));
  return bibliotecaCompleta()
    .filter(x=>x.id!==base.id && x.patron===base.patron && disponible(x) && !fuera.has(normalizarNombre(x.nombre)))
    .map(x=>{
      let p = 0;
      if(x.principal.some(m=>base.principal.includes(m))) p += 3;
      p += 0.5 * x.secundarios.filter(m=>base.secundarios.includes(m)).length;
      if(x.mecanica && x.mecanica===base.mecanica) p += 1;
      if(x.medida===base.medida) p += 1;
      p -= ORDEN_LUMBAR[x.lumbar];                  // a igualdad, primero lo más suave para la lumbar
      const dl = ORDEN_LUMBAR[x.lumbar] - ORDEN_LUMBAR[base.lumbar];
      if(dl > 0) p -= 3*dl;                          // y nunca por encima del original salvo que no quede otra
      if(x.nivel==='Avanzado') p -= 1;
      if(x.propio) p += 3;                           // los agregaste vos: están en tu gimnasio
      return {x, p};
    })
    .sort((a,b)=>b.p - a.p)
    .slice(0, 10)
    .map(o=>o.x);
}
function buscarEnBiblioteca(texto, patron){
  const q = normalizarNombre(texto);
  return bibliotecaCompleta().filter(x=>{
    if(patron && x.patron!==patron) return false;
    if(!q) return true;
    return x.alias.some(a=>a.includes(q)) || normalizarNombre(x.nombre).includes(q) || x.principal.some(m=>normalizarNombre(m).includes(q)) || normalizarNombre(x.equipo).includes(q);
  });
}
function miniaturaEjercicio(x, tam){
  const img = x.ilustracion || x.fotos[0] || null;
  return `<span class="miniatura" style="width:${tam}px;height:${tam}px">${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : icon(x.patron==='cardio' ? 'run' : 'photo')}</span>`;
}
function subtituloEjercicio(x){
  const partes = [x.principal.join(', '), x.equipo];
  if(x.lumbar!=='baja') partes.push(`carga lumbar ${x.lumbar}`);
  return partes.join(' · ');
}
function filaEjercicio(x, onClick, derecha){
  const sub = subtituloEjercicio(x) + (disponible(x) ? '' : ' · no disponible') + (x.propio ? ' · propio' : '');
  return itemFila({iconoHtml: miniaturaEjercicio(x, 44), titulo: x.nombre, sub, derecha, onClick});
}

/* ---------- sustituir ejercicio en la sesión ---------- */
function aplicarSustitucion(ej, nuevoNombre, paraSiempre){
  const ses = state.activeSession;
  const tarde = ses.turno==='tarde';
  const lista = tarde ? state.routineTarde.exercises : state.routine.days[ses.dayIdx % state.routine.days.length].exercises;
  const orig = lista.find(x=>x.nombre===ej.nombre);
  const medidaNueva = medidaPara(buscarEjercicio(nuevoNombre), tarde, ej.medida);
  if(paraSiempre && orig){
    orig.nombre = nuevoNombre;
    ponerMedida(orig, medidaNueva);
  }
  const nada = !ej.sets.some(s=>s.done);
  ej.nombre = nuevoNombre;
  ej.medida = medidaNueva;
  if(nada){
    // todavía no hiciste series: precarga con lo que hiciste la última vez en el ejercicio nuevo

const PALABRAS_VACIAS = new Set(['de','del','con','en','la','el','los','las','a','al','y','para','sobre']);
function palabras(s){ return normalizarNombre(s).split(' ').filter(t=>t && !PALABRAS_VACIAS.has(t)); }
function distancia(a, b){
  let prev = Array.from({length: b.length+1}, (_, j)=>j);
  for(let i=1; i<=a.length; i++){
    const cur = [i];
    for(let j=1; j<=b.length; j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1]===b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
// misma palabra, una abreviatura de la otra ("inclin"/"inclinado") o con un error de tipeo
function palabrasParecidas(a, b){
  if(a===b) return true;
  if(a.length < 4 || b.length < 4) return false;
  return a.startsWith(b) || b.startsWith(a) || distancia(a, b) <= 1;
}
function similitud(a, b){
  const A = palabras(a), B = palabras(b);
  const comunes = A.filter(t=>B.some(u=>palabrasParecidas(t, u))).length;
  return comunes ? comunes / (A.length + B.length - comunes) : 0;
}
function parecidos(nombre, cantidad){
  return bibliotecaCompleta().filter(disponible)
    .map(x=>({x, p: Math.max(...[x.nombre, ...x.alias].map(a=>similitud(nombre, a)))}))
    .filter(o=>o.p > 0)
    .sort((a,b)=>b.p - a.p)
    .slice(0, cantidad)
    .map(o=>o.x);
}
function problemaDe(e){
  if(e.cardio) return null;
  const x = buscarEjercicio(e.nombre);
  if(!x) return 'desconocido';
  return disponible(x) ? null : 'noDisponible';
}
function renombrarEjercicio(e, x, tarde){
  e.nombre = x.nombre;

// el nombre del día es parte de la clave de "lo que hiciste la última vez": se mueve con él
function renombrarDia(dia, nuevo){
  nuevo = String(nuevo).trim();
  if(!nuevo || nuevo===dia.name) return;
  const m = state.lastSetsByDayExercise || {};
  Object.keys(m).filter(k=>k.startsWith(dia.name + '::')).forEach(k=>{
    const nk = nuevo + k.slice(dia.name.length);
    if(!(nk in m)) m[nk] = m[k];
    delete m[k];
  });
  dia.name = nuevo;
}
const NOMBRES_MEDIDA = [['kg+reps','Kg y repeticiones'],['reps','Repeticiones'],['seg','Segundos'],['kg+seg','Kg y segundos'],['kg+m','Kg y metros']];
const CAMPOS_EDITOR = [['series','Series'],['descanso','Descanso (seg)'],['repsMin','Reps mín'],['repsMax','Reps máx'],['calentamiento','Calentamiento'],['aproximacion','Aproximación']];
function normalizarReps(e){
  if(e.repsMin && e.repsMax){ if(e.repsMin > e.repsMax) [e.repsMin, e.repsMax] = [e.repsMax, e.repsMin]; return; }
  const v = e.repsMin || e.repsMax || null;
  e.repsMin = v; e.repsMax = v;
}
// se guarda al salir de cada campo sin redibujar, para no cerrar el teclado
function formDatos(e, tarde){
  const form = el(`<div class="fila2"></div>`);
  const inputs = {};
  const campos = e.circuito ? CAMPOS_EDITOR.filter(([k])=>k==='repsMin' || k==='repsMax') : CAMPOS_EDITOR;
  campos.forEach(([k, label])=>{
    const c = el(`<div class="campo"><label>${label}</label><input type="number" inputmode="numeric" min="0" aria-label="${label}" value="${e[k]==null ? '' : e[k]}"></div>`);
    const inp = inputs[k] = c.querySelector('input');
    inp.onchange = ()=>{
      const v = inp.value==='' ? null : Math.max(0, parseInt(inp.value, 10) || 0);
      if(k==='repsMin' || k==='repsMax'){
        e[k] = v;
        normalizarReps(e);
        inputs.repsMin.value = e.repsMin ?? '';
        inputs.repsMax.value = e.repsMax ?? '';
      } else {
        e[k] = k==='series' ? Math.max(1, v || 1) : (v || 0);
        inp.value = e[k];
      }
      saveState();
    };
    form.appendChild(c);
  });
  const actual = e.medida || (tarde ? 'reps' : 'kg+reps');
  const medida = el(`<div class="campo" style="grid-column:1/-1"><label>Se mide en</label><select aria-label="Se mide en">${NOMBRES_MEDIDA.map(([v,t])=>`<option value="${v}" ${v===actual?'selected':''}>${t}</option>`).join('')}</select></div>`);
  medida.querySelector('select').onchange = (ev)=>{ ponerMedida(e, !tarde && ev.target.value==='kg+reps' ? undefined : ev.target.value); saveState(); };
  form.appendChild(medida);
  return form;
}

// circuito: {id, vueltas, descanso} para sumarlo a uno existente o crear uno nuevo
function agregarAlEditor(x, cardio, circuito){
  const rut = rutinaEditada();
  const tarde = editor.tipo==='tarde';
  const e = cardio ? {nombre: x.nombre, cardio: true} : {nombre: x.nombre, ...DEF_MANANA, alternativas: []};
  if(!cardio){ ponerMedida(e, medidaPara(x, tarde, tarde ? DEF_TARDE.medida : undefined)); sinRepsSiNoCorresponde(e); }
  let pos = rut.exercises.length;
  if(circuito){
    meterEnCircuito(e, circuito);
    const ultimo = rut.exercises.map(y=>y.circuito && y.circuito.id).lastIndexOf(circuito.id);
    if(ultimo >= 0) pos = ultimo + 1;
  }
  rut.exercises.splice(pos, 0, e);
  editor.abierto = cardio ? null : pos;
  guardarEditor();
}
function elegirParaCircuito(titulo, circuito){
  const rut = rutinaEditada();
  abrirModal('elegir', ()=>screenElegir({titulo, subtitulo: rut.name, onElegir: x=>agregarAlEditor(x, false, circuito), volver: cerrarModal}));
}
// mueve un bloque entero (ejercicio suelto o circuito) por encima o por debajo del vecino
function moverBloque(lista, i, dir){
  const bs = bloquesDe(lista);
  const k = bs.findIndex(b=>b.idx.includes(i));
  if(!bs[k+dir]) return;
  [bs[k], bs[k+dir]] = [bs[k+dir], bs[k]];
  lista.splice(0, lista.length, ...bs.flatMap(b=>b.idx.map(x=>lista[x])));
}
function mismoCircuito(a, b){ return !!(a && b && a.circuito && b.circuito && a.circuito.id===b.circuito.id); }
function cambiarCircuito(rut, id, campo, valor){
  rut.exercises.filter(e=>e.circuito && e.circuito.id===id).forEach(e=>{
    e.circuito[campo] = valor;
    if(campo==='vueltas') e.series = valor;
  });
  saveState();
}
function cabeceraCircuito(rut, b){
  const c = b.circuito;
  const cab = el(`<div><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px"><p style="font-weight:600;color:var(--accent)">Circuito</p><div class="acciones-editor" style="flex:0 0 auto"></div></div>
    <div class="fila2"><div class="campo"><label>Vueltas</label><input type="number" inputmode="numeric" min="1" aria-label="Vueltas" value="${c.vueltas}"></div>
    <div class="campo"><label>Descanso por vuelta (seg)</label><input type="number" inputmode="numeric" min="0" aria-label="Descanso por vuelta" value="${c.descanso}"></div></div></div>`);
  const [vueltas, descanso] = cab.querySelectorAll('input');
  vueltas.onchange = ()=>{ const v = Math.max(1, parseInt(vueltas.value, 10) || 1); vueltas.value = v; cambiarCircuito(rut, c.id, 'vueltas', v); };
  descanso.onchange = ()=>{ const v = Math.max(0, parseInt(descanso.value, 10) || 0); descanso.value = v; cambiarCircuito(rut, c.id, 'descanso', v); };
  const acciones = cab.querySelector('.acciones-editor');
  const bs = bloquesDe(rut.exercises);
  const k = bs.findIndex(x=>x.idx[0]===b.idx[0]);
  acciones.appendChild(botonIcono('arrowup', 'Subir circuito', ()=>{ moverBloque(rut.exercises, b.idx[0], -1); guardarEditor(); }, k===0));
  acciones.appendChild(botonIcono('arrowdown', 'Bajar circuito', ()=>{ moverBloque(rut.exercises, b.idx[0], 1); guardarEditor(); }, k===bs.length-1));
  acciones.appendChild(botonIcono('trash', 'Quitar circuito', ()=>{
    if(b.idx.length===rut.exercises.length){ alert('Tiene que quedar al menos un ejercicio.'); return; }
    if(!confirm(`¿Quitar el circuito con sus ${b.idx.length} ejercicios?`)) return;
    rut.exercises.splice(b.idx[0], b.idx.length);
    editor.abierto = null;
    guardarEditor();
  }));
  return cab;
}
function tarjetaEditor(rut, e, i, tarde){
  const x = buscarEjercicio(e.nombre);
  let aviso = '';
  if(!e.cardio && !x) aviso = ' · no está en la biblioteca';
  else if(x && !disponible(x)) aviso = ' · no hay en tu gimnasio';
  const card = el(`<div class="alt-card" style="margin:0"></div>`);
  const fila = itemFila({iconoHtml: x ? miniaturaEjercicio(x, 44) : `<span class="miniatura" style="width:44px;height:44px">${icon(e.cardio ? 'run' : 'photo')}</span>`,
    titulo: e.nombre, sub: (e.cardio ? 'Cardio' : detalleEjercicio(e)) + aviso});
  fila.style.cssText = 'padding:0;border:none;min-height:0';
  card.appendChild(fila);
  // dentro de un circuito se mueve entre sus ejercicios; afuera, salta bloques enteros
  const lista = rut.exercises;
  const bs = bloquesDe(lista);
  const k = bs.findIndex(b=>b.idx.includes(i));
  const puedeSubir = e.circuito ? mismoCircuito(lista[i-1], e) : k > 0;
  const puedeBajar = e.circuito ? mismoCircuito(lista[i+1], e) : k < bs.length-1;
  const mover = (d)=>{
    if(e.circuito) [lista[i], lista[i+d]] = [lista[i+d], lista[i]];
    else moverBloque(lista, i, d);
    editor.abierto = null;
    guardarEditor();
  };
  const quitar = ()=>{
    if(rut.exercises.length===1){ alert('Tiene que quedar al menos un ejercicio.'); return; }
    if(!confirm(`¿Quitar "${e.nombre}"?`)) return;
    rut.exercises.splice(i, 1);
    editor.abierto = null;
    guardarEditor();
  };
  const acciones = el(`<div class="acciones-editor"></div>`);
  if(!e.cardio) acciones.appendChild(boton(`${icon('edit')} Datos`, 'btn-sm', ()=>{ editor.abierto = editor.abierto===i ? null : i; render(); }));
  acciones.appendChild(boton(`${icon('swap')} Cambiar`, 'btn-sm', ()=>cambiarEnEditor(rut, e, tarde)));
  acciones.appendChild(botonIcono('arrowup', 'Subir', ()=>mover(-1), !puedeSubir));
  acciones.appendChild(botonIcono('arrowdown', 'Bajar', ()=>mover(1), !puedeBajar));
  acciones.appendChild(botonIcono('trash', 'Quitar', quitar));
  card.appendChild(acciones);
  if(editor.abierto===i) card.appendChild(formDatos(e, tarde));
  return card;
}
function screenEditor(){
  if(editor.texto) return screenEditorTexto();
  const tarde = editor.tipo==='tarde';
  const rut = rutinaEditada();
  const wrap = document.createElement('div');
  wrap.appendChild(botonVolver(()=>{ editor = null; render(); }));
  wrap.appendChild(el(`<p class="muted" style="font-size:12px;font-weight:600;margin-bottom:6px">${tarde ? 'TURNO TARDE' : `DÍA ${editor.idx+1}`}</p>`));
  const nombre = el(`<input type="text" class="set-input" style="text-align:left;font-size:20px;font-weight:600;margin-bottom:12px" aria-label="Nombre del día" value="${esc(rut.name)}">`);
  nombre.onchange = ()=>{
    if(!tarde) renombrarDia(rut, nombre.value);
    else if(nombre.value.trim()) rut.name = nombre.value.trim();
    nombre.value = rut.name;
    saveState();
  };
  wrap.appendChild(nombre);
  const lista = el(`<div class="pila" style="gap:8px"></div>`);
  bloquesDe(rut.exercises).forEach(b=>{
    if(!b.circuito){ lista.appendChild(tarjetaEditor(rut, rut.exercises[b.idx[0]], b.idx[0], tarde)); return; }
    const caja = el(`<div class="bloque-circuito"></div>`);
    caja.appendChild(cabeceraCircuito(rut, b));
    b.idx.forEach(i=>caja.appendChild(tarjetaEditor(rut, rut.exercises[i], i, tarde)));
    caja.appendChild(boton(`${icon('plus')} Agregar al circuito`, 'btn-dashed btn-full btn-sm', ()=>elegirParaCircuito('Agregar al circuito', b.circuito)));
    lista.appendChild(caja);
  });
  wrap.appendChild(lista);
  const agregar = el(`<div class="fila2" style="margin-top:12px"></div>`);
  agregar.appendChild(boton(`${icon('plus')} Agregar ejercicio`, 'btn-dashed btn-full', ()=>abrirModal('elegir', ()=>screenElegir({
    titulo: 'Agregar ejercicio', subtitulo: rut.name, onElegir: x=>agregarAlEditor(x, false), volver: cerrarModal}))));
  agregar.appendChild(boton(`${icon('reset')} Agregar circuito`, 'btn-dashed btn-full', ()=>elegirParaCircuito('Primer ejercicio del circuito', {id: 'c' + Date.now(), vueltas: 3, descanso: 90})));
  wrap.appendChild(agregar);
  if(tarde) wrap.appendChild(boton(`${icon('run')} Agregar cardio`, 'btn-dashed btn-full', ()=>abrirModal('elegir', ()=>screenElegir({
    titulo: 'Agregar cardio', subtitulo: rut.name, patron: 'cardio', onElegir: x=>agregarAlEditor(x, true), volver: cerrarModal}))));
  if(tarde) wrap.lastChild.style.marginTop = '10px';
  wrap.appendChild(boton(`${icon('edit')} Editar como texto`, 'btn-ghost btn-full', ()=>{ editor.texto = true; render(); }));
  return wrap;
}
function screenEditorTexto(){
  const wrap = document.createElement('div');
  wrap.appendChild(botonVolver(()=>{ editor.texto = false; render(); }));
  wrap.appendChild(el(`<h2 style="margin-bottom:6px">Editar como texto</h2>`));
  if(editor.tipo==='tarde'){ wrap.appendChild(contenidoEditarTarde()); return wrap; }
  const idx = editor.idx;
  wrap.appendChild(el(`<p class="secondary" style="font-size:13px;margin-bottom:12px">Para pegar lo que te pase el Project.</p>`));
  const ta = el(`<textarea id="daypaste" aria-label="Día en texto">${esc(diaToText(state.routine.days[idx], idx))}</textarea>`);
  wrap.appendChild(ta);
  wrap.appendChild(boton('Guardar cambios de este día', 'btn-primary btn-full', ()=>{
    const parsed = parseRoutine(ta.value);
    if(!parsed.days.length){ alert('No se pudo leer el día. Revisá el formato.'); return; }
    const dia = parsed.days[0];
    revisarYGuardar({titulo: 'Revisar día', grupos: [{nombre: dia.name, ejercicios: dia.exercises}], tarde: false, texto: {id: 'daypaste', valor: ta.value},
      guardar: ()=>{
        const nombreNuevo = dia.name;
        dia.name = state.routine.days[idx].name;
        renombrarDia(dia, nombreNuevo);
        state.routine.days[idx] = dia;
        editor = null;
        saveState(); render();
      }});
  }));
  wrap.lastChild.style.marginTop = '12px';
  return wrap;
}

/* ---------- al terminar un ejercicio: recomendación y paso automático ---------- */
const PASO_PESO = {'Barra':2.5, 'Barra Z':2.5, 'Smith':2.5, 'Mancuernas':2, 'Máquina':5, 'Polea':2.5, 'Kettlebell':4};
function pasoDe(nombre){ const x = buscarEjercicio(nombre); return (x && PASO_PESO[x.equipo]) || 2.5; }
function fmtKg(n){ return String(Math.round(n*100)/100).replace('.', ','); }
function recomendacion(ej){
  if(ej.cardio) return null;
  const hechas = ej.sets.filter(s=>s.done && (s.tipo==='Normal' || s.tipo==='Fallo'));
  if(!hechas.length) return null;
  const campos = camposDe(ej.medida);
  if(campos.includes('reps') && ej.repsMax){
    if(hechas.every(s=>(s.reps||0) >= ej.repsMax)){
      if(campos.includes('peso')){
        const nuevo = Math.max(...hechas.map(s=>s.peso||0)) + pasoDe(ej.nombre);
        return {tipo:'subir', texto:`Llegaste a ${ej.repsMax} reps en todas las series. La próxima te precargo ${fmtKg(nuevo)} kg.`};
      }
      return {tipo:'subir', texto:`Llegaste al tope de repeticiones. La próxima sumá dificultad: más lento, con lastre o una variante más exigente.`};
    }
    if(ej.repsMin && hechas.some(s=>(s.reps||0) < ej.repsMin)){
      return {tipo:'bajar', texto:`Alguna serie quedó por debajo de ${ej.repsMin} reps. La próxima mantené el peso o bajalo un poco.`};
    }
    return {tipo:'mantener', texto:`Dentro del rango. La próxima mantené el peso y buscá llegar a ${ej.repsMax} reps en todas.`};
  }
  // sin rango de repeticiones (segundos, metros...): comparación con la vez pasada, serie por serie
  const comparables = hechas.filter(s=>s.prev);
  if(!comparables.length) return {tipo:'info', texto:'Primera vez que lo registrás así. La próxima te muestro cómo te fue comparado con hoy.'};
  const suma = s=>campos.reduce((a,c)=>a + (s[c]||0), 0);
  const hoy = comparables.reduce((a,s)=>a + suma(s), 0);
  const antes = comparables.reduce((a,s)=>a + suma(s.prev), 0);
  if(hoy > antes) return {tipo:'subir', texto:'Mejoraste respecto de la vez pasada. Seguí sumando de a poco.'};
  if(hoy === antes) return {tipo:'mantener', texto:'Igual que la vez pasada. La próxima intentá sumar un poco.'};
  return {tipo:'bajar', texto:'Hoy rendiste menos que la vez pasada. Pasa: mantené y seguí.'};
}
function siguientePendiente(ses, desde){
  for(let k=1; k<=ses.exercises.length; k++){
    const i = (desde + k) % ses.exercises.length;
    if(!exDone(ses.exercises[i])) return i;
  }
  return -1;
}
let cierreIntervalo = null;
function cerrarCierre(){ clearInterval(cierreIntervalo); const c = document.getElementById('cierre'); if(c) c.remove(); }
function mostrarCierreEjercicio(ej){ mostrarCierre([ej]); }
// un ejercicio o todo un circuito: recomendación de cada uno y paso automático al siguiente
function mostrarCierre(ejs){
  const ses = state.activeSession;
  cerrarCierre();
  const todo = ses.exercises.every(exDone);
  const sig = todo ? -1 : siguientePendiente(ses, ses.exercises.indexOf(ejs[ejs.length-1]));
  const colores = {subir:'var(--success)', bajar:'var(--warn)', mantener:'var(--text-2)', info:'var(--text-2)'};
  const recs = ejs.map(e=>({e, rec: recomendacion(e)})).filter(o=>o.rec);
  const varios = ejs.length > 1;
  const titulo = varios ? 'Circuito: listo' : `${esc(ejs[0].nombre)}: listo`;
  const caja = el(`<div id="cierre" class="cierre" role="dialog" aria-live="polite" aria-label="${todo?'Sesión completa':'Ejercicio completo'}">
    <p style="font-weight:700;font-size:17px;margin-bottom:6px">${todo ? 'Sesión completa' : titulo}</p>
    ${recs.map(({e, rec})=>`<p style="font-size:14px;color:${colores[rec.tipo]};margin-bottom:8px">${varios ? `<b>${esc(e.nombre)}:</b> ` : ''}${esc(rec.texto)}</p>`).join('')}
    <p class="secondary cuenta" style="font-size:13px;margin-bottom:12px"></p>
    <div class="fila2"></div>
  </div>`);
  let quedan = 5;
  const accion = todo ? ()=>{ cerrarCierre(); finalizarSesion(); }
    : ()=>{ cerrarCierre(); ses.focusIdx = sig; saveState(); render(); mostrarMotivacion(frase(FRASES_SIGUIENTE)); };
  const pintar = ()=>{ caja.querySelector('.cuenta').textContent = todo ? `Finalizando en ${quedan} s` : `Sigue ${ses.exercises[sig].nombre} en ${quedan} s`; };
  const botones = caja.querySelector('.fila2');
  botones.appendChild(boton(todo ? 'Seguir entrenando' : 'Quedarme', 'btn-full', cerrarCierre));
  botones.appendChild(boton(todo ? 'Finalizar ahora' : 'Ir ahora', 'btn-primary btn-full', accion));
  pintar();
  document.body.appendChild(caja);
  cierreIntervalo = setInterval(()=>{ quedan--; if(quedan<=0) accion(); else pintar(); }, 1000);
}

/* ---------- init ---------- */
render();
if(state.activeSession && state.activeSession.descanso) programarDescanso();
iniciarMedia();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
