<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#141414">
<title>Entrenamiento</title>
<link rel="manifest" href="manifest.json">
<script src="exercise-map.js"></script>
<style>
  :root{
    --bg:#f4f3f0; --surface:#ffffff; --surface-2:#eeece7;
    --text:#141414; --text-2:#5f5e5a; --text-muted:#8a8880;
    --border:#dedcd5; --accent:#185fa5; --accent-bg:#e6f1fb;
    --success:#3b6d11; --success-bg:#eaf3de;
    --danger:#a32d2d; --danger-bg:#fcebeb;
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141414; --surface:#1e1e1c; --surface-2:#262624;
      --text:#f1efe8; --text-2:#b4b2a9; --text-muted:#888780;
      --border:#3a3a37; --accent:#85b7eb; --accent-bg:#0c447c;
      --success:#97c459; --success-bg:#27500a;
      --danger:#f09595; --danger-bg:#501313;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit}
  .btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px;font-size:14px;color:var(--text)}
  .btn:active{transform:scale(0.98)}
  .btn-primary{background:var(--text);color:var(--bg);border:none;font-weight:600}
  .btn-full{width:100%}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
  .muted{color:var(--text-muted)}
  .secondary{color:var(--text-2)}
  h1{font-size:22px;margin:0;font-weight:600}
  h2{font-size:17px;margin:0;font-weight:600}
  p{margin:0}
  #musicbar{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border)}
  #musicbar button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px}
  #screen{padding:16px;flex:1;padding-bottom:90px}
  #tabbar{display:flex;border-top:1px solid var(--border);background:var(--surface);position:sticky;bottom:0;padding-bottom:env(safe-area-inset-bottom)}
  #tabbar button{flex:1;border:none;background:transparent;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text-muted)}
  #tabbar button.active{color:var(--accent)}
  .icon{width:20px;height:20px}
  .banner{background:var(--accent-bg);color:var(--accent);border-radius:var(--radius);padding:12px;font-size:13px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .weekrow{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
  .set-grid{display:grid;grid-template-columns:20px 1fr 1fr 1fr 30px;gap:5px;align-items:center;margin-bottom:6px}
  .set-input{font-size:13px;padding:7px 2px;text-align:center;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);width:100%}
  .set-select{font-size:11px;padding:7px 1px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);width:100%}
  .segbar{display:flex;gap:6px;margin-bottom:4px}
  .seg{flex:1;height:6px;border-radius:4px;background:var(--border);border:none;padding:0}
  .seglabel{flex:1;font-size:10px;line-height:1.25;text-align:center;color:var(--text-muted)}
  .exphoto{width:100%;aspect-ratio:4/3;background:var(--surface-2);border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;overflow:hidden}
  .exphoto img{width:100%;height:100%;object-fit:contain}
  .timerbox{background:var(--surface-2);border-radius:12px;padding:10px;margin-bottom:14px;text-align:center}
  .metricgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;margin:16px 0}
  .metric{background:var(--surface-2);border-radius:8px;padding:12px}
  .metric p:first-child{font-size:12px;color:var(--text-muted);margin-bottom:2px}
  .metric p:last-child{font-size:19px;font-weight:600}
  .hist-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
  textarea{width:100%;min-height:200px;font-family:monospace;font-size:12px;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}
  .alt-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
</style>
</head>
<body>
<div id="app">
  <div id="musicbar"></div>
  <div id="screen"></div>
  <div id="tabbar"></div>
</div>

<script>
/* ---------- estado y persistencia ---------- */
const DIAS_ORDEN = ['Push','Pull','Legs','Tren superior','Pierna + brazos'];

function loadState(){
  const raw = localStorage.getItem('entrenoState');
  if(raw) return JSON.parse(raw);
  return {
    routine: null,          // {days:[{name, exercises:[{nombre,descanso,series,alternativas:[]}]}]}
    history: [],            // sesiones completas
    lastByExercise: {},     // nombre -> {peso,reps}
    prByExercise: {},       // nombre -> mejor volumen (peso*reps) alcanzado
    slot: 0,                // 0..∞, ronda de 5 dias (entrenado o saltado)
    activeSession: null     // sesion en curso
  };
}
let state = loadState();
function saveState(){ localStorage.setItem('entrenoState', JSON.stringify(state)); }

/* ---------- utilidades ---------- */
function fmtTime(sec){ sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60), s=sec%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function weekNumber(){ return Math.min(12, Math.floor(state.slot/5)+1); }
function todayDayIndex(){ return state.slot % 5; }
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function icon(name){ return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`; }
const ICONS = {
  home:'<path d="M3 9l9-6 9 6v11a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  session:'<path d="M4 12h16M6 8v8M18 8v8M2 10v4M22 10v4"/>',
  history:'<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l4 2"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',
  circle:'<circle cx="12" cy="12" r="9"/>',
  trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  play:'<path d="M5 3l14 9-14 9V3z"/>',
  chevleft:'<path d="M15 18l-6-6 6-6"/>',
  chevright:'<path d="M9 18l6-6-6-6"/>',
  photo:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/>',
  spotify:'<circle cx="12" cy="12" r="10"/><path d="M7 10c3-1 7-1 10 1M7.5 13.2c2.5-.8 5.7-.6 8 .8M8 16c2-.6 4.3-.4 6 .6"/>',
  youtube:'<rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  arrowup:'<path d="M12 19V5M5 12l7-7 7 7"/>',
  skip:'<path d="M5 4l10 8-10 8V4z"/><path d="M19 5v14"/>'
};

/* ---------- deep links ---------- */
function abrirSpotify(){ window.location.href = 'spotify:'; setTimeout(()=>{ window.open('https://open.spotify.com','_blank'); },800); }
function abrirYoutube(){ window.location.href = 'youtube:'; setTimeout(()=>{ window.open('https://youtube.com','_blank'); },800); }

/* ---------- parser de rutina ---------- */
function parseRoutine(text){
  const days = [];
  let current = null;
  text.split('\n').forEach(line=>{
    line = line.trim();
    if(!line) return;
    const dayMatch = line.match(/^DIA\s*\d+\s*:\s*(.+)$/i);
    if(dayMatch){
      current = {name: dayMatch[1].trim(), exercises: []};
      days.push(current);
      return;
    }
    if(!current) return;
    const parts = line.split('|').map(p=>p.trim());
    if(parts.length < 1) return;
    const nombre = parts[0];
    let descanso = 90, series = 3, calentamiento = 0, aproximacion = 0, repsMin = 8, repsMax = 12, alternativas = [];
    parts.slice(1).forEach(p=>{
      const dm = p.match(/descanso\s*(\d+)/i);
      const sm = p.match(/series\s*(\d+)/i);
      const cm = p.match(/calentamiento\s*(\d+)/i);
      const apm = p.match(/aproximaci[oó]n\s*(\d+)/i);
      const rm = p.match(/reps\s*(\d+)\s*-\s*(\d+)/i);
      const am = p.match(/alt:\s*(.+)/i);
      if(dm) descanso = parseInt(dm[1],10);
      if(sm) series = parseInt(sm[1],10);
      if(cm) calentamiento = parseInt(cm[1],10);
      if(apm) aproximacion = parseInt(apm[1],10);
      if(rm){ repsMin = parseInt(rm[1],10); repsMax = parseInt(rm[2],10); }
      if(am) alternativas = am[1].split(',').map(a=>({nombre:a.trim(), detalle:''}));
    });
    current.exercises.push({nombre, descanso, series, calentamiento, aproximacion, repsMin, repsMax, alternativas});
  });
  return {days};
}

/* ---------- navegacion ---------- */
let currentTab = state.currentTab || 'inicio';
let sessionView = state.sessionView || 'activa';

function setTab(id){ currentTab = id; state.currentTab = id; saveState(); render(); }
function setSessionView(v){ sessionView = v; state.sessionView = v; saveState(); }
const TABS = [
  {id:'inicio', label:'Inicio', icon:'home'},
  {id:'sesion', label:'Sesión', icon:'session'},
  {id:'rutina', label:'Rutina', icon:'edit'},
  {id:'historial', label:'Historial', icon:'history'}
];

function renderTabbar(){
  const t = document.getElementById('tabbar');
  t.innerHTML = '';
  TABS.forEach(tb=>{
    const btn = el(`<button class="${tb.id===currentTab?'active':''}">${icon(tb.icon)}<span style="font-size:11px">${tb.label}</span></button>`);
    btn.onclick = ()=>{ setTab(tb.id); };
    t.appendChild(btn);
  });
}
function renderMusicbar(){
  const m = document.getElementById('musicbar');
  if(currentTab==='inicio' || currentTab==='sesion'){
    m.style.display = 'flex';
    m.innerHTML = `<button class="btn" onclick="abrirSpotify()">${icon('spotify')} Spotify</button>
      <button class="btn" onclick="abrirYoutube()">${icon('youtube')} YouTube</button>`;
  } else { m.style.display='none'; m.innerHTML=''; }
}

function render(){
  renderMusicbar();
  renderTabbar();
  const s = document.getElementById('screen');
  s.innerHTML = '';
  if(!state.routine){ s.appendChild(screenSinRutina()); return; }
  if(currentTab==='inicio') s.appendChild(screenInicio());
  else if(currentTab==='sesion') s.appendChild(screenSesionWrap());
  else if(currentTab==='rutina') s.appendChild(screenRutina());
  else if(currentTab==='historial') s.appendChild(screenHistorial());
}

/* ---------- pantalla: sin rutina cargada ---------- */
const PROMPT_GENERADOR = `Necesito que me armes una rutina de entrenamiento de gimnasio. Antes de armarla, hacéme las preguntas que necesites sobre lo que no te haya contestado abajo. Si dejo algo en blanco o pongo "no sé", recomendame vos con criterio de entrenador.

MIS DATOS:
- Objetivo (fuerza, hipertrofia, resistencia, salud general, bajar de peso): 
- Nivel de experiencia (principiante, intermedio, avanzado, o tiempo que llevo entrenando/parado): 
- Días por semana que puedo entrenar: 
- Tiempo disponible por sesión (minutos): 
- Equipamiento disponible (gimnasio completo, casa con mancuernas, sin equipo, etc.): 
- Lesiones, molestias o limitaciones físicas a tener en cuenta: 
- ¿Querés entrenamiento aeróbico/cardio? (sí integrado el mismo día / sí en día aparte / no): 
- Cantidad de ejercicios por día que preferís (o "recomendame"): 
- Rango de repeticiones que preferís, ej. 8-12 (o "recomendame según mi objetivo"): 
- Grupos musculares que querés priorizar, si hay alguno: 

Una vez que tengas todo, dame la rutina completa día por día, EXACTAMENTE en este formato (para pegarla en una app de seguimiento):

DIA 1: [nombre del día, ej. Push]
[Nombre del ejercicio] | descanso [segundos] | calentamiento [cantidad, 0 si no aplica] | aproximacion [cantidad, 0 si no aplica] | series [cantidad de series de trabajo] | reps [rango, ej. 8-12] | alt: [sustituto 1], [sustituto 2]

Reglas del formato:
- Un bloque "DIA N: nombre" por cada día.
- Un renglón por ejercicio, con los campos separados por " | ", tal cual el orden de arriba.
- "descanso" siempre en segundos, no en minutos.
- "calentamiento" y "aproximacion" son cantidad de series de ese tipo, no le pongas texto.
- "series" son solo las series de trabajo, sin contar calentamiento/aproximación.
- Si el ejercicio tiene sustitutos, listalos después de "alt:", separados por coma. Si no tiene, omití ese campo.
- No agregues explicaciones, numeración ni texto suelto dentro del bloque de ejercicios — la app lo lee línea por línea y cualquier texto extra rompe la lectura.`;

function screenSinRutina(){
  const wrap = el(`<div>
    <h1>Cargá tu rutina</h1>
    <p class="secondary" style="margin:8px 0 16px">Pegá tu rutina abajo siguiendo este formato, un renglón por ejercicio.</p>
    <div class="card" style="margin-bottom:12px;font-size:12px;line-height:1.6">
      <p style="font-weight:600;margin-bottom:6px">Formato:</p>
      <p class="muted" style="margin-bottom:8px">Cada día empieza con <b>DIA N: nombre</b>. Cada ejercicio es un renglón con los datos separados por <b> | </b>.</p>
      <p style="font-family:monospace;background:var(--surface-2);padding:8px;border-radius:6px;white-space:pre-wrap;word-break:break-word">DIA 1: [nombre del día]
[Ejercicio] | descanso 120 | calentamiento 1 | aproximacion 1 | series 3 | reps 8-12 | alt: [sustituto 1], [sustituto 2]</p>
      <p class="muted" style="margin-top:8px">Campos: <b>descanso</b> en segundos · <b>calentamiento</b>/<b>aproximacion</b> = cantidad de series de ese tipo (0 si no aplica) · <b>series</b> = series normales de trabajo · <b>reps</b> = rango objetivo · <b>alt</b> = sustitutos separados por coma (opcional).</p>
    </div>
    <button class="btn btn-full" id="btnCopiarPrompt" style="margin-bottom:16px">📋 Copiar prompt para pedírselo a una IA</button>
    <div id="promptMsg" style="font-size:12px;color:var(--success);text-align:center;margin-bottom:8px"></div>
    <p class="muted" style="font-size:12px;margin-bottom:16px">Pegalo en cualquier IA (Claude, ChatGPT, Gemini) — trae preguntas sobre tus días, objetivo, tiempo, equipamiento y demás, y te devuelve la rutina lista en el formato correcto para pegar acá abajo.</p>
    <textarea id="routinepaste" placeholder="DIA 1: Push
[Ejercicio] | descanso 120 | calentamiento 1 | aproximacion 1 | series 3 | reps 8-12 | alt: [sustituto 1], [sustituto 2]"></textarea>
    <button class="btn btn-primary btn-full" style="margin-top:12px" onclick="cargarRutina()">Cargar rutina</button>
  </div>`);
  const copyBtn = wrap.querySelector('#btnCopiarPrompt');
  const msg = wrap.querySelector('#promptMsg');
  copyBtn.onclick = ()=>{
    navigator.clipboard.writeText(PROMPT_GENERADOR).then(()=>{ msg.textContent = 'Prompt copiado, pegalo en tu IA preferida'; })
      .catch(()=>{ msg.textContent = 'No se pudo copiar automáticamente.'; });
  };
  return wrap;
}
function cargarRutina(){
  const txt = document.getElementById('routinepaste').value;
  const parsed = parseRoutine(txt);
  if(!parsed.days.length){ alert('No se pudo leer la rutina. Revisá el formato.'); return; }
  const reemplazando = !!state.routine;
  state.routine = parsed;
  saveState();
  if(reemplazando){ currentTab='inicio'; state.currentTab='inicio'; }
  render();
}

let editDayIdx = null;
let dayHoldTimeout = null;

function diaToText(day, idx){
  let out = `DIA ${idx+1}: ${day.name}\n`;
  day.exercises.forEach(e=>{
    out += `${e.nombre} | descanso ${e.descanso} | calentamiento ${e.calentamiento||0} | aproximacion ${e.aproximacion||0} | series ${e.series} | reps ${e.repsMin||8}-${e.repsMax||12}`;
    if(e.alternativas && e.alternativas.length) out += ` | alt: ${e.alternativas.map(a=>a.nombre).join(', ')}`;
    out += '\n';
  });
  return out;
}

/* ---------- pantalla: rutina (ver actual / cargar nueva) ---------- */
function screenRutina(){
  if(editDayIdx!==null) return screenEditarDia(editDayIdx);

  const wrap = document.createElement('div');
  wrap.appendChild(el(`<h2 style="margin-bottom:4px">Rutina actual</h2>`));
  wrap.appendChild(el(`<p class="muted" style="font-size:12px;margin-bottom:12px">Mantené presionado un día para editarlo.</p>`));

  state.routine.days.forEach((d,i)=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.style.marginBottom = '10px';
    card.innerHTML = `<p style="font-weight:600;margin-bottom:6px">${d.name}</p>` +
      d.exercises.map(e=>`<p class="muted" style="font-size:13px;margin-bottom:2px">${e.nombre} — ${e.series} series${e.repsMin?` de ${e.repsMin}-${e.repsMax} reps`:''}</p>`).join('');

    let held = false;
    const startHold = ()=>{ held=false; dayHoldTimeout = setTimeout(()=>{ held=true; editDayIdx=i; render(); },550); };
    const cancelHold = ()=>{ clearTimeout(dayHoldTimeout); };
    card.onmousedown = startHold; card.onmouseup = cancelHold; card.onmouseleave = cancelHold;
    card.ontouchstart = startHold; card.ontouchend = cancelHold;
    wrap.appendChild(card);
  });

  wrap.appendChild(el(`<p class="secondary" style="font-size:13px;margin:20px 0 8px">Cargar una rutina nueva completa</p>`));
  wrap.appendChild(el(`<p class="muted" style="font-size:12px;margin-bottom:8px">Esto reemplaza todos los días. Tu historial de sesiones no se pierde.</p>`));
  const verFormatoBtn = el(`<button class="btn" style="font-size:12px;padding:6px 10px;margin-bottom:10px">Ver formato</button>`);
  const formatoBox = el(`<div class="card" style="margin-bottom:10px;font-size:12px;line-height:1.6;display:none">
    <p class="muted">Cada día empieza con <b>DIA N: nombre</b>. Cada ejercicio: nombre + datos separados por <b> | </b>.</p>
    <p style="font-family:monospace;background:var(--surface-2);padding:8px;border-radius:6px;white-space:pre-wrap;margin-top:6px">[Ejercicio] | descanso 120 | calentamiento 1 | aproximacion 1 | series 3 | reps 8-12 | alt: [sustituto 1], [sustituto 2]</p>
  </div>`);
  verFormatoBtn.onclick = ()=>{ formatoBox.style.display = formatoBox.style.display==='none' ? 'block' : 'none'; };
  wrap.appendChild(verFormatoBtn);
  wrap.appendChild(formatoBox);
  const copyPromptBtn2 = el(`<button class="btn btn-full" style="margin-bottom:10px">📋 Copiar prompt para pedírselo a una IA</button>`);
  const promptMsg2 = el(`<div style="font-size:12px;color:var(--success);text-align:center;margin-bottom:8px"></div>`);
  copyPromptBtn2.onclick = ()=>{
    navigator.clipboard.writeText(PROMPT_GENERADOR).then(()=>{ promptMsg2.textContent = 'Prompt copiado, pegalo en tu IA preferida'; })
      .catch(()=>{ promptMsg2.textContent = 'No se pudo copiar automáticamente.'; });
  };
  wrap.appendChild(copyPromptBtn2);
  wrap.appendChild(promptMsg2);
  wrap.appendChild(el(`<textarea id="routinepaste" placeholder="DIA 1: Push
[Ejercicio] | descanso 120 | calentamiento 1 | aproximacion 1 | series 3 | reps 8-12 | alt: [sustituto 1], [sustituto 2]"></textarea>`));
  const btn = el(`<button class="btn btn-primary btn-full" style="margin-top:12px">Reemplazar rutina completa</button>`);
  btn.onclick = ()=>{ if(confirm('¿Reemplazar toda la rutina actual por esta nueva?')){ cargarRutina(); } };
  wrap.appendChild(btn);

  wrap.appendChild(el(`<p class="secondary" style="font-size:13px;margin:24px 0 8px">Reiniciar avance</p>`));
  const btnResetSemana = el(`<button class="btn btn-full" style="margin-bottom:8px">Reiniciar semana actual (volver al Día 1 de esta semana)</button>`);
  btnResetSemana.onclick = ()=>{
    if(confirm('¿Volver a repetir la semana actual desde el Día 1?')){
      state.slot = Math.floor(state.slot/5)*5;
      state.showWeekBanner = null;
      saveState(); render();
    }
  };
  wrap.appendChild(btnResetSemana);
  const btnResetTodo = el(`<button class="btn btn-full">Reiniciar rutina completa (volver a Semana 1)</button>`);
  btnResetTodo.onclick = ()=>{
    if(confirm('¿Reiniciar toda la rutina desde Semana 1? El historial de sesiones ya guardado no se borra.')){
      state.slot = 0;
      state.showWeekBanner = null;
      saveState(); render();
    }
  };
  wrap.appendChild(btnResetTodo);

  wrap.appendChild(el(`<p class="secondary" style="font-size:13px;margin:24px 0 8px">Notificaciones</p>`));
  wrap.appendChild(el(`<p class="muted" style="font-size:12px;margin-bottom:8px">Para que suene y vibre aunque estés en otra app durante el descanso. En algunos celus con ahorro de batería agresivo puede no funcionar si pasa mucho tiempo en segundo plano.</p>`));
  const notifStatus = window.Notification ? Notification.permission : 'unsupported';
  if(notifStatus==='granted'){
    wrap.appendChild(el(`<p style="font-size:13px;margin-bottom:16px">✅ Notificaciones activadas</p>`));
  } else if(notifStatus==='unsupported'){

// sessionView (activa | sustituir | resumen) ya declarado arriba, junto a currentTab
let sustEjIdx = null;
let holdTimeout = null;
let holdFired = false;
let restInterval = null;

function empezarSesion(dayIdx){
  const day = state.routine.days[dayIdx % state.routine.days.length];
  state.activeSession = {
    dayIdx, dayName: day.name, inicio: Date.now(),
    focusIdx: 0,
    exercises: day.exercises.map(e=>({
      nombre: e.nombre, descanso: (state.customDescanso && state.customDescanso[e.nombre]) || e.descanso,
      alternativas: e.alternativas, repsMin: e.repsMin, repsMax: e.repsMax,
      sets: seedSets(e)
    }))
  };
  state.resumenCelebrado = false;
  setSessionView('activa');
  setTab('sesion');
}
function seedSets(e){
  const last = state.lastByExercise[e.nombre];
  const repsTarget = last ? last.reps : Math.round(((e.repsMin||8)+(e.repsMax||12))/2);
  const pesoTarget = last ? last.peso : 0;
  const sets = [];
  const nCal = e.calentamiento || 0;
  const nApx = e.aproximacion || 0;
  const nNorm = e.series || 3;
  for(let i=0;i<nCal;i++) sets.push({peso: Math.round(pesoTarget*0.5), reps: repsTarget, tipo:'Calentamiento', done:false, rpe:null});
  for(let i=0;i<nApx;i++) sets.push({peso: Math.round(pesoTarget*0.75), reps: repsTarget, tipo:'Aproximación', done:false, rpe:null});
  for(let i=0;i<nNorm;i++) sets.push({peso: pesoTarget, reps: repsTarget, tipo:'Normal', done:false, rpe:null});
  if(sets.length===0) sets.push({peso: pesoTarget, reps: repsTarget, tipo:'Normal', done:false, rpe:null});
  return sets;
}
function exDone(ej){ return ej.sets.every(s=>s.done); }
function debeSubirPeso(ej){
  const normales = ej.sets.filter(s=>s.tipo==='Normal');
  if(!normales.length || !normales.every(s=>s.done)) return false;
  const max = ej.repsMax || 12;
  return normales.every(s=>s.reps >= max);
}

/* ---------- discos, 1RM y notas ---------- */
const DISCOS_DISPONIBLES = [25,20,15,10,5,2.5,1.25];
function calcularDiscos(pesoTotal, pesoBarra){
  pesoBarra = pesoBarra || 20;
  let porLado = (pesoTotal - pesoBarra) / 2;
  if(porLado <= 0) return { discos: [], sobra: 0, imposible: pesoTotal < pesoBarra };
  const usados = [];
  DISCOS_DISPONIBLES.forEach(d=>{
    while(porLado >= d - 0.001){ usados.push(d); porLado -= d; }
  });
  return { discos: usados, sobra: Math.round(porLado*100)/100, imposible: false };
}
function estimar1RM(peso, reps){
  if(!peso || !reps) return 0;
  return Math.round(peso * (1 + reps/30));
}
function mejorSetActual(ej){
  let mejor = null;
  ej.sets.filter(s=>s.tipo==='Normal' && s.done && s.peso>0).forEach(s=>{
    const e1rm = estimar1RM(s.peso, s.reps);
    if(!mejor || e1rm > mejor.e1rm) mejor = {peso:s.peso, reps:s.reps, e1rm};
  });
  return mejor;
}

function renderStatsRow(ej){
  const wrap = el(`<div style="display:flex;gap:8px;margin-bottom:14px"></div>`);
  const mejor = mejorSetActual(ej);
  const stat1RM = el(`<div class="card" style="flex:1;padding:8px;text-align:center"><p class="muted" style="font-size:10px;margin-bottom:2px">1RM estimado hoy</p><p style="font-size:15px;font-weight:600">${mejor ? mejor.e1rm+' kg' : '—'}</p></div>`);
  wrap.appendChild(stat1RM);
  const btnDiscos = el(`<button class="card" style="flex:1;padding:8px;text-align:center;background:var(--surface)"><p class="muted" style="font-size:10px;margin-bottom:2px">Calculadora</p><p style="font-size:15px;font-weight:600">🏋️ Discos</p></button>`);
  btnDiscos.onclick = ()=>{ setSessionView('discos'); render(); };
  wrap.appendChild(btnDiscos);
  return wrap;
}
function ses_global_focus(){ return state.activeSession.focusIdx; }

function screenDiscos(){
  const ses = state.activeSession;
  const ej = ses.exercises[ses.focusIdx];
  const mejor = mejorSetActual(ej);
  const pesoSugerido = mejor ? mejor.peso : (ej.sets.find(s=>s.tipo==='Normal')||{}).peso || 0;
  const wrap = document.createElement('div');
  const back = el(`<button class="btn" style="font-size:12px;padding:5px 10px;margin-bottom:12px">${icon('chevleft')} Volver</button>`);
  back.onclick = ()=>{ setSessionView('activa'); render(); };
  wrap.appendChild(back);
  wrap.appendChild(el(`<h2 style="margin-bottom:12px">Calculadora de discos</h2>`));
  wrap.appendChild(el(`<p class="muted" style="font-size:12px;margin-bottom:4px">Peso total en la barra (kg)</p>`));
  const pesoInput = el(`<input type="text" inputmode="decimal" class="set-input" style="width:100%;margin-bottom:8px" value="${pesoSugerido}">`);
  pesoInput.onfocus = ()=>pesoInput.select();
  wrap.appendChild(pesoInput);
  wrap.appendChild(el(`<p class="muted" style="font-size:12px;margin-bottom:4px">Peso de la barra (kg)</p>`));
  const barraInput = el(`<input type="text" inputmode="decimal" class="set-input" style="width:100%;margin-bottom:12px" value="${state.pesoBarra||20}">`);
  barraInput.onfocus = ()=>barraInput.select();
  wrap.appendChild(barraInput);
  const resultBox = el(`<div class="card"></div>`);
  wrap.appendChild(resultBox);
  function actualizar(){
    const pt = parseFloat(pesoInput.value.replace(',','.'))||0;
    const pb = parseFloat(barraInput.value.replace(',','.'))||20;
    state.pesoBarra = pb; saveState();
    const r = calcularDiscos(pt, pb);
    if(r.imposible){
      resultBox.innerHTML = `<p class="muted" style="font-size:13px">El peso total es menor a la barra sola.</p>`;
      return;
    }
    if(!r.discos.length){
      resultBox.innerHTML = `<p style="font-size:14px">Solo la barra, sin discos.</p>`;
      return;
    }
    const conteo = {};
    r.discos.forEach(d=>{ conteo[d]=(conteo[d]||0)+1; });
    resultBox.innerHTML = `<p class="secondary" style="font-size:13px;margin-bottom:8px">Por lado (x2 para el total):</p>` +
      Object.keys(conteo).sort((a,b)=>b-a).map(d=>`<p style="font-size:16px;margin-bottom:4px">● ${d} kg × ${conteo[d]}</p>`).join('') +
      (r.sobra>0 ? `<p class="muted" style="font-size:12px;margin-top:6px">No se puede llegar exacto, sobran ${r.sobra} kg por lado.</p>` : '');
  }

function renderSetRow(ej,s,si){
  const row = document.createElement('div');
  row.style.cssText = 'border:1px solid var(--border);border-radius:8px;padding:8px;margin-bottom:8px';

  const topRow = el(`<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"></div>`);
  topRow.appendChild(el(`<span style="font-size:12px;color:var(--text-muted);width:16px">${si+1}</span>`));

  function stepperCell(label, value, onChange){
    const wrap = el(`<div style="flex:1;display:flex;align-items:center;gap:4px"></div>`);
    const minus = el(`<button aria-label="Restar ${label}" style="width:26px;height:26px;padding:0;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:16px;line-height:1">−</button>`);
    const input = el(`<input type="text" inputmode="${label==='peso'?'decimal':'numeric'}" pattern="${label==='peso'?'':'[0-9]*'}" class="set-input" style="text-align:center" value="${value}">`);
    const plus = el(`<button aria-label="Sumar ${label}" style="width:26px;height:26px;padding:0;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:16px;line-height:1">+</button>`);
    input.onfocus = ()=>{ input.select(); };
    input.oninput = ()=>{ onChange(label==='peso' ? (parseFloat(input.value.replace(',','.'))||0) : (parseInt(input.value)||0)); saveState(); };
    minus.onclick = ()=>{ const step = label==='peso'?2.5:1; const nv = Math.max(0, (label==='peso'?s.peso:s.reps) - step); onChange(nv); input.value = nv; saveState(); };
    plus.onclick = ()=>{ const step = label==='peso'?2.5:1; const nv = (label==='peso'?s.peso:s.reps) + step; onChange(nv); input.value = nv; saveState(); };
    wrap.appendChild(minus); wrap.appendChild(input); wrap.appendChild(plus);
    return wrap;
  }

  topRow.appendChild(stepperCell('peso', s.peso, v=>{ s.peso = v; }));
  topRow.appendChild(stepperCell('reps', s.reps, v=>{ s.reps = v; }));
  row.appendChild(topRow);

  const botRow = el(`<div style="display:flex;align-items:center;gap:6px"></div>`);
  botRow.appendChild(el(`<span style="width:16px"></span>`));
  const tipoSel = el(`<select class="set-select" style="flex:1">${['Calentamiento','Aproximación','Normal','Fallo'].map(t=>`<option ${t===s.tipo?'selected':''}>${t}</option>`).join('')}</select>`);
  tipoSel.onchange = ()=>{ s.tipo = tipoSel.value; saveState(); };
  botRow.appendChild(tipoSel);

  const rpeSel = el(`<select class="set-select" style="width:64px" aria-label="RPE (esfuerzo percibido)"><option value="">RPE</option>${[6,7,8,9,10].map(r=>`<option value="${r}" ${s.rpe==r?'selected':''}>${r}</option>`).join('')}</select>`);
  rpeSel.onchange = ()=>{ s.rpe = rpeSel.value ? parseInt(rpeSel.value) : null; saveState(); };
  botRow.appendChild(rpeSel);

  const actionBtn = document.createElement('button');
  actionBtn.style.cssText = 'padding:0;width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:6px;background:var(--surface)';
  actionBtn.innerHTML = s.deleteMode ? icon('trash') : (s.done ? icon('check') : icon('circle'));
  actionBtn.style.color = s.deleteMode ? 'var(--danger)' : (s.done ? 'var(--success)' : 'var(--text-muted)');

  let held = false;
  const startHold = ()=>{
    held = false;
    holdTimeout = setTimeout(()=>{
      held = true;
      s.deleteMode = !s.deleteMode;
      saveState(); render();
    },550);
  };
  const cancelHold = ()=>{ clearTimeout(holdTimeout); };
  const click = ()=>{
    if(held) return;
    if(s.deleteMode){
      if(ej.sets.length>1){ ej.sets.splice(si,1); saveState(); render(); }
      return;
    }
    s.done = !s.done;
    if(s.done){ registrarSetDone(ej,s); iniciarTimer(ej); }
    saveState(); render();
  };
  actionBtn.onmousedown = startHold; actionBtn.onmouseup = cancelHold; actionBtn.onmouseleave = cancelHold;
  actionBtn.ontouchstart = startHold; actionBtn.ontouchend = cancelHold;
  actionBtn.onclick = click;
  botRow.appendChild(actionBtn);
  row.appendChild(botRow);

  return row;
}

function registrarSetDone(ej,s){
  const vol = s.peso * s.reps;
  const prevPR = state.prByExercise[ej.nombre] || 0;
  if(vol > prevPR){
    state.prByExercise[ej.nombre] = vol;
    ej.prLogrado = true;
  }
}

/* ---------- sonido y frases motivadoras ---------- */
function beep(){
  if(state.sonidoPreferido==='custom' && state.customSounds && state.customSounds.length){
    try{
      const elegido = state.customSounds[Math.floor(Math.random()*state.customSounds.length)];
      const audio = new Audio(elegido.data);
      audio.play().catch(()=>{});
      return;
    } catch(e){}
  }
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0,0.15,0.3].forEach((t,i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = i<2 ? 880 : 1320;
      gain.gain.setValueAtTime(0.15, ctx.currentTime + t);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.12);
      osc.start(ctx.currentTime + t);
      osc.stop(ctx.currentTime + t + 0.13);
    });
  } catch(e){}
}

const FRASES_TIMER = ['¡Vamos que se puede!','A meterle con todo','¡Dale con fuerza!','Concentración total','¡Es tu momento!'];
const FRASES_SIGUIENTE = ['Siguiente ejercicio, ¡a full!','Vamos por el que sigue','No aflojes ahora'];
const FRASES_FINAL = ['¡Sesión completada, gran laburo!','¡Lo lograste, a descansar!','¡Excelente entrenamiento hoy!'];

function frase(lista){ return lista[Math.floor(Math.random()*lista.length)]; }

function mostrarMotivacion(texto){
  if(state.motivacionOn===false) return;
  const existing = document.getElementById('motivtoast');
  if(existing) existing.remove();
  const toast = el(`<div id="motivtoast" style="position:fixed;left:16px;right:16px;bottom:80px;max-width:448px;margin:0 auto;background:var(--text);color:var(--bg);padding:12px 16px;border-radius:10px;text-align:center;font-size:14px;font-weight:600;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,0.2)">${texto}</div>`);
  document.body.appendChild(toast);
  setTimeout(()=>{ toast.remove(); }, 2200);
}

let notifTimeoutId = null;

function iniciarTimer(ej){
  clearInterval(restInterval);
  clearTimeout(notifTimeoutId);
  ej.timerCorriendo = true;
  ej.timerFinEn = Date.now() + ej.descanso*1000;
  ej.tiempoRestante = ej.descanso;
  ej.timerCompletado = false;
  tickTimer(ej);
  restInterval = setInterval(()=>tickTimer(ej), 1000);

  if(window.Notification && Notification.permission==='granted'){
    notifTimeoutId = setTimeout(()=>{
      try{
        new Notification('Descanso terminado', { body: `Volvé a ${ej.nombre}`, vibrate: [200,100,200], tag: 'descanso-timer', renotify: true });
      } catch(e){}
    }, ej.descanso*1000);
  }
}

function tickTimer(ej){
  if(!ej.timerCorriendo) return;
  const restanteMs = ej.timerFinEn - Date.now();
  ej.tiempoRestante = Math.max(0, Math.ceil(restanteMs/1000));
  if(restanteMs <= 0 && !ej.timerCompletado){
    ej.timerCompletado = true;
    ej.timerCorriendo = false;
    clearInterval(restInterval);
    beep();
    mostrarMotivacion(frase(FRASES_TIMER));
  }
  const label = document.querySelector('.timerbox p:nth-of-type(2)');
  if(label) label.textContent = fmtTime(ej.tiempoRestante);
}

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && state.activeSession){
    const ej = state.activeSession.exercises[state.activeSession.focusIdx];

/* ---------- finalizar sesión ---------- */
function finalizarSesion(){
  const ses = state.activeSession;
  const duracionSeg = Math.round((Date.now()-ses.inicio)/1000);
  let volumenTotal = 0, prCount = 0;
  ses.exercises.forEach(e=>{
    e.sets.forEach(s=>{ volumenTotal += s.peso*s.reps; });
    if(e.prLogrado) prCount++;
    const normalesHechas = e.sets.filter(s=>s.tipo==='Normal' && s.done && s.peso>0);
    const referencia = normalesHechas.length ? normalesHechas[normalesHechas.length-1] : e.sets[e.sets.length-1];
    state.lastByExercise[e.nombre] = {peso: referencia.peso, reps: referencia.reps};
  });

  const prevSame = [...state.history].reverse().find(h=>h.dayName===ses.dayName);
  let comparacion = null;
  if(prevSame){
    const diff = prevSame.volumenTotal ? Math.round(((volumenTotal-prevSame.volumenTotal)/prevSame.volumenTotal)*100) : null;
    comparacion = diff;
  }

  const record = {
    fecha: new Date().toISOString(), dayName: ses.dayName,
    exercises: ses.exercises.map(e=>({nombre:e.nombre, sets:e.sets})),
    duracionSeg, volumenTotal, prCount, comparacion
  };
  state.history.push(record);

  avanzarSlot();

  state.lastResumen = record;
  state.activeSession = null;
  setSessionView('resumen');
  saveState();
  render();
}

  state.slot++;

}

function renderChartEjercicio(nombre){
  const puntos = [];
  state.history.forEach(h=>{
    const ex = h.exercises.find(e=>e.nombre===nombre);
    if(!ex) return;
    let mejor1rm = 0, mejorPeso = 0;
    ex.sets.filter(s=>s.tipo==='Normal').forEach(s=>{
      const e1rm = estimar1RM(s.peso, s.reps);
      if(e1rm > mejor1rm){ mejor1rm = e1rm; mejorPeso = s.peso; }
    });
    if(mejor1rm>0) puntos.push({fecha: new Date(h.fecha), peso: mejorPeso, e1rm: mejor1rm});
  });
  if(puntos.length < 2){
    return el(`<p class="muted" style="font-size:12px">Necesitás al menos 2 sesiones de este ejercicio para ver el gráfico.</p>`);
  }
  const w = 320, h = 140, pad = 24;
  const maxV = Math.max(...puntos.map(p=>p.e1rm)) * 1.1;
  const minV = Math.min(...puntos.map(p=>p.e1rm)) * 0.9;
  const xStep = (w - pad*2) / (puntos.length - 1);
  const yFor = v => h - pad - ((v - minV) / (maxV - minV || 1)) * (h - pad*2);
  const coords = puntos.map((p,i)=>`${pad + i*xStep},${yFor(p.e1rm)}`);
  const path = 'M ' + coords.join(' L ');
  const dots = puntos.map((p,i)=>`<circle cx="${pad + i*xStep}" cy="${yFor(p.e1rm)}" r="3" fill="var(--accent)"></circle>`).join('');
  const first = puntos[0], last = puntos[puntos.length-1];
  const svg = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    ${dots}
  </svg>`;
  const wrap = el(`<div class="card"></div>`);
  wrap.innerHTML = svg;
  wrap.appendChild(el(`<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-muted);margin-top:4px">
    <span>${first.fecha.toLocaleDateString('es-AR',{day:'2-digit',month:'short'})}: ${first.e1rm}kg 1RM</span>
    <span>${last.fecha.toLocaleDateString('es-AR',{day:'2-digit',month:'short'})}: ${last.e1rm}kg 1RM</span>
  </div>`));
  return wrap;
}

function generarInforme(){
  let out = `INFORME DE ENTRENAMIENTO\n`;
  state.history.forEach(h=>{
    const fecha = new Date(h.fecha).toLocaleDateString('es-AR');
    out += `\n${fecha} - ${h.dayName}\n`;
    h.exercises.forEach(e=>{
      const setsStr = e.sets.map(s=>`${s.peso}kg x ${s.reps}${s.rpe?` RPE${s.rpe}`:''} (${s.tipo})`).join(', ');
      out += `  ${e.nombre}: ${setsStr}\n`;
      const nota = (state.notasEjercicio||{})[e.nombre];
      if(nota) out += `    Nota: ${nota}\n`;
    });
    out += `  Volumen total: ${Math.round(h.volumenTotal)} kg | Duración: ${Math.round(h.duracionSeg/60)} min\n`;
  });
  return out;
}

function generarCSV(){
  const rows = [['Fecha','Dia','Ejercicio','Serie','Peso','Reps','Tipo','RPE']];
  state.history.forEach(h=>{
    const fecha = new Date(h.fecha).toLocaleDateString('es-AR');
    h.exercises.forEach(e=>{
      e.sets.forEach((s,i)=>{
        rows.push([fecha, h.dayName, e.nombre, i+1, s.peso, s.reps, s.tipo, s.rpe||'']);
      });
    });
  });
  return rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
}

/* ---------- init ---------- */
render();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
